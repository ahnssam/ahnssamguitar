        fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + id))
            .then(r => r.ok ? r.json().then(j => ({ title: j.title, author: j.author_name }))
                : { title: r.status === 401 || r.status === 403 ? '비공개거나 퍼가기를 막은 영상이에요' : '영상을 찾을 수 없어요 — 주소를 확인해 주세요' })
            .catch(() => ({ title: '' }))
            .then(d => { if (d.author) ytInfo[id] = d; show(d); });
    }
    form.elements.youtube.addEventListener('input', updateYt);
    // 그림은 올릴 때마다 새 이름(<악보 id>-<올린 때>) — 주소가 바뀌어야 브라우저·CDN 에 남은 예전 그림 대신 새 그림이 보인다
    const freshPath = (id, blob) => `${id}-${Date.now().toString(36)}.${extOf(blob)}`;
    const extOf = blob => blob.type === 'image/webp' ? 'webp' : blob.type === 'image/png' ? 'png' : 'jpg';

    $('saveBtn').onclick = () => save();
    async function save() {
        const el = form.elements;
        const base = el.title.value.trim();
        if (!base) { el.title.focus(); $('edMsg').textContent = '곡명을 넣어 주세요.'; return; }
        // 편곡별 묶음: 제목 = 공통 곡명 + " (편곡 이름)". 편곡 이름은 '편곡'으로 끝나게 (메인·상세가 그걸로 이름을 보여 준다)
        const isVer = grpKind === 'versions' && linkIds.size > 0;
        const tagNorm = t => { t = String(t || '').trim(); return !t ? '' : /편곡$/.test(t) ? t : t + ' 편곡'; };
        const title = isVer && tagNorm(el.ver_tag.value) ? `${base} (${tagNorm(el.ver_tag.value)})` : base;
        const yt = youtubeId(el.youtube.value);
        if (yt === undefined) { el.youtube.focus(); $('edMsg').textContent = '유튜브 주소를 알아볼 수 없어요.'; return; }
        const hasPdf = !!newPdf || !!(editing && filesById[editing.id]);
        if (el.published.checked && !hasPdf) { $('edMsg').textContent = 'PDF를 올려야 공개할 수 있어요.'; return; }
        const nul = v => (v || '').trim() || null;
        const row = {
            title,
            title_original: nul(el.title_original.value),
            artist: nul(el.artist.value),
            kind: el.kind.value,
            style: el.style.value || null,
            genre: nul(el.genre.value),
            difficulty,
            price: Math.max(0, parseInt(el.price.value, 10) || 0),
            pages: parseInt(el.pages.value, 10) || null,
            youtube_id: yt,
            capo: parseInt(el.capo.value, 10) || null,
            lyricist: nul(el.lyricist.value),
            composer: nul(el.composer.value),
            album: nul(el.album.value),
            label: nul(el.label.value),
            release_date: nul(el.release_date.value),
            komca_code: nul(el.komca_code.value),
            published: el.published.checked,
        };
        $('saveBtn').disabled = true;
        $('edMsg').textContent = '저장하고 있어요…';
        try {
            let id = editing && editing.id;
            if (id) {
                const { error } = await sb.from('sheets').update(row).eq('id', id);
                if (error) throw error;
            } else {
                // 파일을 다 올리기 전에는 비공개로 만들어 두고, 끝나면 공개 여부를 반영한다
                const { data, error } = await sb.from('sheets').insert({ ...row, published: false }).select('id').single();
                if (error) throw error;
                id = data.id;
            }
            // 묶기 — 묶음 전체에 같은 키(파트별 song_key / 편곡별 version_key), 빠진 악보는 풀고, 혼자 남으면 묶음 없음.
            //   묶음 종류를 바꿨으면 예전 종류의 키는 지운다.
            const col = isVer ? 'version_key' : 'song_key';
            const keyOf = (i, c) => (sheets.find(x => x.id === i) || {})[c] || null;
            const members = [id, ...linkIds];
            const setKey = async (c, ids, key) => { ids = ids.filter(i => keyOf(i, c) !== key || (i === id && (editing ? editing[c] : null) !== key)); if (!ids.length) return; const { error } = await sb.from('sheets').update({ [c]: key }).in('id', ids); if (error) throw error; };
            const openedCol = openedKind === 'versions' ? 'version_key' : openedKind === 'parts' ? 'song_key' : null;
            const before = editing && openedCol && editing[openedCol] ? sheets.filter(x => x[openedCol] === editing[openedCol]).map(x => x.id) : [];
            if (members.length > 1) {
                const key = (editing && editing[col]) || [...linkIds].map(i => keyOf(i, col)).find(Boolean) || crypto.randomUUID();
                await setKey(col, members, key);
                if (openedCol && openedCol !== col) await setKey(openedCol, before, null);           // 종류를 바꿈 → 예전 묶음 키 지우기
                else await setKey(col, before.filter(i => !members.includes(i)), null);              // 빠진 악보 풀기
            } else if (before.length) {
                const rest = before.filter(i => i !== id);
                await setKey(openedCol, rest.length === 1 ? [id, ...rest] : [id], null);
            }
            // 공통 칸은 묶인 악보 모두에 — 바뀐 칸만 (같은 값을 다시 쓰면 '새로 나온 악보' 순서가 바뀌어서)
            if (members.length > 1) {
                const COMMON = ['title_original', 'artist', 'kind', 'genre', 'lyricist', 'composer', 'album', 'label', 'release_date', 'komca_code'];
                for (const mid of linkIds) {
                    const m = sheets.find(x => x.id === mid); if (!m) continue;
                    const patch = {};
                    // 이번에 고친 공통 칸만 (원래 악보마다 다르던 값은 그대로)
                    COMMON.forEach(k => { if (editing && (editing[k] ?? null) !== (row[k] ?? null)) { if ((m[k] ?? null) !== (row[k] ?? null)) patch[k] = row[k]; } });
                    // 곡명: 공통 곡명을 고쳤거나 묶음 종류를 바꿨을 때만 맞춘다 (새로 묶기만 한 악보의 제목은 그대로)
                    const openedBase = editing ? (openedKind === 'versions' ? String(editing.title || '').replace(VER_RE, '') : editing.title) : null;
                    if (editing && (openedBase !== base || (openedKind && openedKind !== grpKind))) {
                        const mt = isVer ? (String(m.title || '').match(VER_RE) || [])[1] : null;
                        const wantTitle = mt ? `${base} (${mt})` : base;
                        if (m.title !== wantTitle) patch.title = wantTitle;
                    }
                    if (Object.keys(patch).length) { const { error } = await sb.from('sheets').update(patch).eq('id', mid); if (error) throw error; }
                }
            }
            if (newPreview) {
                $('edMsg').textContent = '미리보기 이미지를 올리고 있어요…';
                const path = freshPath(id, newPreview);
                const up = await sb.storage.from(PREVIEW_BUCKET).upload(path, newPreview, { upsert: true, contentType: newPreview.type || 'image/jpeg', cacheControl: '3600' });
                if (up.error) throw up.error;
                const { error } = await sb.from('sheets').update({ preview_path: path }).eq('id', id);
                if (error) throw error;
                if (editing && editing.preview_path && editing.preview_path !== path) await sb.storage.from(PREVIEW_BUCKET).remove([editing.preview_path]);
            }
            if (newCover) {
                $('edMsg').textContent = '앨범 커버를 올리고 있어요…';
                const path = freshPath(id, newCover);
                const up = await sb.storage.from(COVER_BUCKET).upload(path, newCover, { upsert: true, contentType: newCover.type || 'image/jpeg', cacheControl: '3600' });
                if (up.error) throw up.error;
                const { error } = await sb.from('sheets').update({ cover_path: path }).eq('id', id);
                if (error) throw error;
                if (editing && editing.cover_path && editing.cover_path !== path) await removeCover(editing.cover_path, id);
            } else if (dropCover && editing && editing.cover_path) {
                const { error } = await sb.from('sheets').update({ cover_path: null }).eq('id', id);
                if (error) throw error;
                await removeCover(editing.cover_path, id);
            }
            if (newPdf) {
                $('edMsg').textContent = 'PDF를 올리고 있어요…';
                const path = `${id}.pdf`;
                const up = await sb.storage.from(PDF_BUCKET).upload(path, newPdf, { upsert: true, contentType: 'application/pdf' });
                if (up.error) throw up.error;
                const { error } = await sb.from('sheet_files').upsert({ sheet_id: id, pdf_path: path, file_name: newPdf.name, file_size: newPdf.size });
                if (error) throw error;
            }
            if (!editing && row.published) {
                const { error } = await sb.from('sheets').update({ published: true }).eq('id', id);
                if (error) throw error;
            }
            closeEditor();
            await load();
            if (!$('rank').hidden) renderRank();
        } catch (err) {
            console.error(err);
            $('edMsg').textContent = '저장하지 못했어요: ' + (err.message || err);
        } finally {
            $('saveBtn').disabled = false;
        }
    }

    $('delBtn').onclick = async () => {
        if (!editing) return;
        if (!confirm(`'${editing.title}' 악보를 삭제할까요? PDF·미리보기·앨범 커버도 함께 지워지고 되돌릴 수 없어요.`)) return;
        const id = editing.id;
        $('edMsg').textContent = '삭제하고 있어요…';
        const f = filesById[id];
        if (f) await sb.storage.from(PDF_BUCKET).remove([`${id}.pdf`]);
        if (editing.preview_path) await sb.storage.from(PREVIEW_BUCKET).remove([editing.preview_path]);
        if (editing.cover_path) await removeCover(editing.cover_path, id);
        const { error } = await sb.from('sheets').delete().eq('id', id);
        if (error) { $('edMsg').textContent = '삭제하지 못했어요: ' + error.message; return; }
        closeEditor();
        load();
    };
})();
</script>
<script src="/auth.js" defer></script>
</body>
