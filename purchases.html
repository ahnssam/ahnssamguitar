<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>구매한 악보 | 안쌤의 기타나무숲</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        a { text-decoration: none; color: inherit; }
        :root {
            --green-deep: #2a6b4a; --green-dark: #3a8a5c; --green-mid: #52a872;
            --green-pale: #b5e6c8; --green-faint: #e2f5ea; --cream: #f5fbf7;
            --text-dark: #1a1a1a; --text-mid: #4a4a4a; --text-light: #7a7a7a; --red: #c0392b;
        }
        body { font-family: 'Noto Sans KR', sans-serif; color: var(--text-dark); background: var(--cream); min-height: 100vh; }
        .hd { background: #fff; border-bottom: 1px solid rgba(42,107,74,0.12); }
        .hd-in { max-width: 860px; margin: 0 auto; height: 72px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .hd-logo img { height: 52px; display: block; }
        .hd-right { display: flex; align-items: center; gap: 14px; }
        .hd-link { font-size: 14px; font-weight: 700; color: var(--green-deep); }
        main { max-width: 860px; margin: 0 auto; padding: 32px 16px 80px; }
        h1 { font-size: 26px; font-weight: 900; color: var(--green-deep); letter-spacing: -0.02em; margin-bottom: 18px; }

        /* 결제 결과 */
        .pay { border-radius: 18px; padding: 22px 22px; margin-bottom: 26px; display: flex; gap: 16px; align-items: flex-start; background: #fff; box-shadow: 0 8px 24px rgba(42,107,74,0.10); }
        .pay[hidden] { display: none; }
        .pay > i { font-size: 30px; margin-top: 2px; }
        .pay.ok { border: 2px solid var(--green-mid); }
        .pay.ok > i { color: var(--green-mid); }
        .pay.bad { border: 2px solid #f0c4be; }
        .pay.bad > i { color: var(--red); }
        .pay.wait > i { color: var(--green-dark); }
        .pay h2 { font-size: 19px; font-weight: 900; margin-bottom: 4px; }
        .pay p { font-size: 14px; color: var(--text-mid); line-height: 1.6; }
        .pay .acts { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }

        .btn { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 22px; padding: 10px 18px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; background: var(--green-deep); color: #fff; }
        .btn:hover { background: var(--green-dark); }
        .btn.line { background: #fff; color: var(--green-deep); border: 1.5px solid var(--green-pale); }
        .btn:disabled { opacity: 0.6; cursor: default; }

        /* 목록 */
        .list { background: #fff; border-radius: 18px; box-shadow: 0 8px 24px rgba(42,107,74,0.08); overflow: hidden; }
        .row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; border-top: 1px solid #eef3f0; }
        .row:first-child { border-top: 0; }
        .row.new { background: #f3fbf6; }
        .thumb { width: 64px; height: 80px; border-radius: 6px; background: var(--green-faint) center top / cover no-repeat; border: 1px solid #e3ece6; }
        .info b { display: block; font-size: 15.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .info small { display: block; font-size: 13px; color: var(--text-light); margin-top: 3px; }
        .tag-test { display: inline-block; font-size: 11px; font-weight: 700; color: #a06a00; background: #fff3d6; border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
        .empty { text-align: center; padding: 56px 20px; color: var(--text-light); }
        .empty i { font-size: 36px; color: var(--green-pale); margin-bottom: 12px; display: block; }
        .empty p { margin-bottom: 16px; line-height: 1.6; }
        .note { font-size: 12.5px; color: var(--text-light); margin-top: 14px; line-height: 1.6; }
        /* 하단 사업자 정보 (전자상거래법 표시 사항 — 다른 페이지 하단과 같은 내용) */
        .ft { border-top: 1px solid #e3ece6; margin-top: 40px; padding: 22px 20px 30px; text-align: center; font-size: 12px; color: var(--text-light); line-height: 1.9; }
        .ft .ft-links { display: flex; justify-content: center; gap: 16px; margin-bottom: 6px; font-weight: 700; color: var(--green-deep); }
        .ft span + span::before { content: '|'; margin: 0 8px; opacity: 0.4; }
        @media (max-width: 600px) {
            .ft span { display: block; }
            .ft span + span::before { content: none; }
            .hd-in { height: 60px; }
            .hd-logo img { height: 42px; }
            .hd-link { display: none; }
            h1 { font-size: 22px; }
            .row { grid-template-columns: 48px minmax(0, 1fr); padding: 12px 14px; }
            .thumb { width: 48px; height: 60px; }
            .row .btn { grid-column: 1 / -1; justify-content: center; }
        }
    </style>
</head>
<body>
    <header class="hd">
        <div class="hd-in">
            <a class="hd-logo" href="/"><img src="images/logo-vertical.webp" alt="안쌤의 기타나무숲"></a>
            <div class="hd-right">
                <a class="hd-link" href="/#shop" onclick="sessionStorage.setItem('gotoTab','tab')">TAB악보 보러 가기</a>
                <div class="auth-slot" style="display:inline-flex;align-items:center;"></div>
            </div>
        </div>
    </header>

    <main>
        <h1>구매한 악보</h1>
        <div class="pay" id="pay" hidden></div>
        <div class="list" id="list"><div class="empty"><i class="fas fa-spinner fa-spin"></i><p>불러오고 있어요…</p></div></div>
        <p class="note">PDF는 개인 연습·학습용이에요. 다른 사람에게 나눠 주거나 올리지 말아 주세요.<br>내려받기에 문제가 있으면 <a href="mailto:ahnssamguitar@gmail.com" style="color:var(--green-deep);font-weight:700;">ahnssamguitar@gmail.com</a> 으로 알려 주세요.</p>
    </main>

    <footer class="ft">
        <div class="ft-links"><a href="legal/terms.html">이용약관</a><a href="legal/terms.html#refund">환불 정책</a><a href="legal/privacy.html">개인정보 처리방침</a></div>
        <span>상호: 안쌤의 기타나무숲</span><span>대표: 안규호</span><span>사업자등록번호: 453-22-00905</span><br>
        <span>주소: 서울특별시 강남구 영동대로 210 쌍용종합상가 지하1층 3호</span><span>고객센터: <a href="tel:050713349804">0507-1334-9804</a></span><span>이메일: <a href="mailto:ahnssamguitar@gmail.com">ahnssamguitar@gmail.com</a></span>
    </footer>

    <script src="auth.js" defer></script>
    <script src="checkout.js" defer></script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        'use strict';
        const C = window.ahnssamCheckout;
        const SB_URL = 'https://qpcbrqgqylxkgdwoflku.supabase.co';
        const $ = id => document.getElementById(id);
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const won = n => Number(n || 0).toLocaleString() + '원';
        const day = t => { const d = new Date(t); return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`; };
        let items = [];
        let newSheet = null;   // 방금 결제한 악보

        function showPay(kind, icon, title, text, acts) {
            const el = $('pay');
            el.className = 'pay ' + kind;
            el.innerHTML = `<i class="fas ${icon}"></i><div><h2>${title}</h2><p>${text}</p>${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
            el.hidden = false;
        }

        function render() {
            if (!items.length) {
                $('list').innerHTML = `<div class="empty"><i class="fas fa-music"></i><p>아직 구매한 악보가 없어요.</p><a class="btn" href="/#shop" onclick="sessionStorage.setItem('gotoTab','tab')">TAB악보 보러 가기</a></div>`;
                return;
            }
            $('list').innerHTML = items.map(s => {
                const img = s.preview_path ? `${SB_URL}/storage/v1/object/public/sheet-previews/${encodeURIComponent(s.preview_path)}?v=${encodeURIComponent(s.updated_at)}` : '';
                return `<div class="row${s.sheet_id === newSheet ? ' new' : ''}">
                    <div class="thumb" style="${img ? `background-image:url('${img}')` : ''}"></div>
                    <div class="info"><b>${esc(s.title)}${s.is_test ? '<span class="tag-test">테스트 결제</span>' : ''}</b>
                        <small>${esc(s.artist || '')}${s.pages ? ' · ' + s.pages + '페이지' : ''}</small>
                        <small>${day(s.purchased_at)} 구매 · ${won(s.amount)}</small></div>
                    <button class="btn" data-dl="${s.sheet_id}"><i class="fas fa-download"></i> PDF 내려받기</button>
                </div>`;
            }).join('');
        }

        async function loadList() {
            try { items = await C.myPurchases(); render(); }
            catch (e) { $('list').innerHTML = `<div class="empty"><i class="fas fa-triangle-exclamation"></i><p>목록을 불러오지 못했어요.<br><small>${esc(e.message)}</small></p></div>`; }
        }

        document.addEventListener('click', async e => {
            const b = e.target.closest('[data-dl]');
            if (!b) return;
            const s = items.find(x => x.sheet_id === b.dataset.dl);
            b.disabled = true;
            await C.download(b.dataset.dl, s && s.title);
            setTimeout(() => { b.disabled = false; }, 1500);
        });

        (async function start() {
            await C.ready();
            const auth = window.ahnssamAuth;
            if (!auth || !auth.getSession()) {
                $('list').innerHTML = `<div class="empty"><i class="fas fa-lock"></i><p>로그인하면 구매한 악보를 볼 수 있어요.</p><button class="btn" id="loginBtn">로그인</button></div>`;
                $('loginBtn').onclick = () => auth && auth.openLogin();
                window.addEventListener('ahnssam-auth-settled', ev => { if (ev.detail && ev.detail.user) location.reload(); }, { once: true });
                return;
            }

            const q = new URLSearchParams(location.search);
            const back = C.returnSheet();
            const backBtn = back ? `<a class="btn line" href="/tab-detail.html?id=${encodeURIComponent(back)}"><i class="fas fa-arrow-left"></i> 악보로 돌아가기</a>` : '';
            if (q.get('paymentKey') && q.get('orderId')) {
                // 토스 결제창에서 성공으로 돌아옴 → 서버에 승인 요청
                showPay('wait', 'fa-spinner fa-spin', '결제를 확인하고 있어요…', '창을 닫지 말고 잠시만 기다려 주세요.');
                const r = await C.confirm(q.get('paymentKey'), q.get('orderId'), q.get('amount'));
                history.replaceState(null, '', location.pathname);
                if (r && r.ok) {
                    newSheet = r.sheet_id;
                    showPay('ok', 'fa-circle-check', '결제가 완료됐어요', '고맙습니다! 아래에서 바로 PDF를 내려받을 수 있어요. 언제든 이 페이지(내 메뉴 → 구매한 악보)에서 다시 받을 수 있어요.',
                        `<button class="btn" data-dl="${esc(r.sheet_id)}"><i class="fas fa-download"></i> PDF 내려받기</button>`);
                } else {
                    const why = (r && (r.message || { order_closed: '이미 끝났거나 취소된 주문이에요.', test_mode_admin_only: '지금은 결제 연동을 점검하고 있어서 실제 구매는 되지 않아요. 방금 결제는 테스트라 돈이 빠지지 않았어요. 이 악보는 지금 풀스코어에서 구매할 수 있어요(악보 페이지에 링크가 있어요).', record_failed: '결제는 됐는데 기록에 문제가 생겼어요. 주문번호를 메일로 알려 주시면 바로 처리해 드릴게요.' }[r.error])) || '결제를 확인하지 못했어요.';
                    showPay('bad', 'fa-circle-exclamation', '결제가 완료되지 않았어요', esc(why) + (r && r.order_id ? `<br><small>주문번호 ${esc(r.order_id)}</small>` : ''), backBtn);
                }
            } else if (q.get('code')) {
                // 결제창에서 실패·취소로 돌아옴
                history.replaceState(null, '', location.pathname);
                const canceled = q.get('code') === 'PAY_PROCESS_CANCELED' || q.get('code') === 'USER_CANCEL';
                showPay('bad', canceled ? 'fa-circle-xmark' : 'fa-circle-exclamation',
                    canceled ? '결제를 취소했어요' : '결제가 되지 않았어요',
                    canceled ? '돈은 빠지지 않았어요. 다시 구매하려면 악보로 돌아가 주세요.' : esc(q.get('message') || '잠시 뒤 다시 시도해 주세요.'), backBtn);
            }
            await loadList();
        })();
    });
    </script>
</body>
</html>
