    /* 말풍선 (박 사장·민지·ㅇㅇ) */
    /* 작업자 대사: 기타 이름표 바로 아래에 작게 (2026-11-12 사용자: 아래에 뜨면 기타 몸통을 가림). 이름표가 없으면(빈 작업대) 맨 위 */
    .talk { position: absolute; left: 12px; right: 12px; top: 62px; z-index: 6; display: flex; gap: 8px; align-items: flex-start; background: rgba(14, 22, 20, 0.88); border: 2px solid rgba(255, 255, 255, 0.14); border-radius: 14px; padding: 7px 10px; color: #fff; cursor: pointer; animation: fade .2s; }

    .talk p { font-size: 12.5px; line-height: 1.4; }
    /* 이름표·대사 덩어리: 가운데 위에 같이 둥실. 대사는 이름표 꼬리(▼) 바로 아래에 붙는다 */
    .nmhud { position: absolute; left: 50%; top: 14px; z-index: 6; width: calc(100% - 24px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; pointer-events: none; animation: nmBob 2.8s ease-in-out infinite; }
    .nmhud .nmtag { position: relative; left: auto; top: auto; transform: none; animation: none; max-width: 100%; pointer-events: auto; }
    .nmhud .talk { position: relative; left: auto; right: auto; top: auto; margin-top: 11px; width: max-content; max-width: 100%; pointer-events: auto; }
    .nmhud .nmtag[hidden] + .talk { margin-top: -2px; }
    .talk .more { position: absolute; right: 10px; bottom: 6px; font-size: 10px; opacity: .6; }

    /* 튜너 */
    /* 무대 안 아래에 늘 '강화(넓게) | 진열하기' (2026-11-12 사용자 요청) — 말풍선은 그 위로 */
    .sact { position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 5; display: grid; grid-template-columns: 2.4fr 1fr; gap: 8px; animation: fade .2s; }
    .sact.one { grid-template-columns: 1fr; }
    .sact button { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 12px 10px; border-radius: 14px; font-weight: 900; font-size: 16px; color: #fff; white-space: nowrap; }

    .sact .hg { font-size: 14.5px; background: rgba(14, 22, 20, 0.86); border: 2px solid rgba(255, 255, 255, 0.28); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.45); }
    .sact button:active { transform: translateY(3px); }
    /* 강화 위 하드케이스 ON/OFF (+7부터) */
    .sact.cs-on .ag { grid-row: 2; grid-column: 1; }
    .sact.cs-on .hg { grid-row: 2; grid-column: 2; }
    .sact .cs { grid-row: 1; grid-column: 1; justify-self: center; padding: 6px 12px; gap: 6px; border-radius: 99px; font-size: 13px; font-weight: 800;
        background: rgba(14, 22, 20, 0.82); border: 2px solid rgba(255, 255, 255, 0.3); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4); }
    .sact .cs b { font-weight: 900; color: #c9d2ce; }

    .sact .cs.on { background: linear-gradient(#3fb877, #23935a); border-color: #b9f5d2; box-shadow: 0 3px 0 #16683e, 0 0 14px rgba(80, 230, 150, 0.55); }
    .sact .cs.on b { color: #fff; }
    .sact .cs.none { opacity: .8; }

    /* 작업방 */
    /* 작업방: 진열 벽 (걸이 5개, 2026-11-12 사용자 그림). 스킨마다 걸이 위치는 WALLS 에 */
    .wall5 { position: relative; border-radius: 18px; overflow: hidden; background: #1d2a26; }
    .wall5 > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .wall5 .wg { position: absolute; width: auto; aspect-ratio: 56 / 84; transform: translateX(-50%); image-rendering: auto; pointer-events: none; filter: drop-shadow(0 5px 3px rgba(0, 0, 0, 0.45)); }
    .wall5 .wg.sel { filter: drop-shadow(0 0 6px #ffe27a) drop-shadow(0 0 2px #ffe27a); }
    .wall5 .wsb { position: absolute; width: 13%; transform: translateX(-50%); border-radius: 10px; background: transparent; }
    .wall5 .wsb:focus-visible { outline: 2px solid #ffe27a; }
    /* 기타를 고른 뒤: 빈 걸이에 점선 (누르면 그리로 옮김) */
    .wall5 .wsb.to { border: 2px dashed rgba(255, 226, 122, 0.75); background: rgba(255, 226, 122, 0.08); }
    /* 바닥 빈 발판(앰프·멀티 자리) */
    .wall5 .fpad { position: absolute; transform: translateX(-50%); border: 2px dashed rgba(255, 240, 210, 0.5); border-radius: 8px; background: rgba(0, 0, 0, 0.22);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: rgba(255, 240, 210, 0.7); pointer-events: none; }
    .wall5 .fpad i { font-size: clamp(10px, 2.6vw, 15px); }
    .wall5 .fpad span { font-size: clamp(8px, 1.9vw, 11px); font-weight: 800; }
    .wall5.enter .fpad { animation: fadeOnly .5s ease-out both; animation-delay: .45s; }
    .rinfo.sel { color: #8a5a00; background: #fff6d8; border-radius: 10px; padding: 6px 10px; }
    .wall5 .wl { position: absolute; top: 0; width: 15.5%; height: 71.4%; transform: translateX(-50%); background: linear-gradient(rgba(6, 10, 9, 0.88), rgba(6, 10, 9, 0.74) 70%, rgba(6, 10, 9, 0.45)); pointer-events: none; }
    .wall5 .wl.off { animation: lightOn .9s ease-out forwards; }
    @keyframes lightOn { 0% { opacity: 1; } 25% { opacity: .35; } 35% { opacity: .85; } 55% { opacity: .2; } 100% { opacity: 0; } }
    .wall5 .wsb.lock { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: #e8f0ec; font-weight: 900; }
    .wall5 .wsb.lock i { font-size: clamp(14px, 3.6vw, 20px); opacity: .9; }
    .wall5 .wsb.lock span { font-size: clamp(9.5px, 2.4vw, 12.5px); background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 99px; padding: 2px 7px; white-space: nowrap; }
    .wall5 .wsb.lock.sure span { background: #f5b31e; color: #3a2400; border-color: #f5b31e; }
    .wall5 .wp { position: absolute; z-index: 3; transform: translate(-50%, -50%); font: 900 clamp(9px, 2.4vw, 14px)/1 'Arial Black', sans-serif; color: #4a2c0c; text-shadow: 0 1px 0 rgba(255, 240, 190, 0.6); pointer-events: none; }
    .wall5 .wp.floor { color: #fff; background: rgba(0, 0, 0, 0.55); border-radius: 99px; padding: 2px 6px; text-shadow: none; }   /* 바닥 물건(앰프·멀티)은 명판이 없어 작은 꼬리표로 */
    .wall5 .wrep { position: absolute; transform: translate(-50%, -50%); font-size: clamp(9px, 2.2vw, 11px); font-weight: 900; color: #3a2400; background: #f5b31e; border-radius: 99px; padding: 1px 7px; pointer-events: none; }
    /* 작업방에 들어갈 때: 벽이 사악 밝아지고, 기타가 가운데부터 내려와 걸린다 */
    .wall5.enter { animation: wallIn .9s ease-out both; }
    .wall5.enter .wg { animation: wgIn .6s ease-out both; animation-delay: calc(.35s + var(--d, 0s)); }
    .wall5.enter .wp, .wall5.enter .wrep, .wall5.enter .wsb.lock { animation: fadeOnly .5s ease-out both; animation-delay: .45s; }
    @keyframes wallIn { from { opacity: 0; filter: brightness(.3); } to { opacity: 1; filter: none; } }
    @keyframes wgIn { from { opacity: 0; transform: translate(-50%, -5%); } to { opacity: 1; transform: translateX(-50%); } }
    @keyframes fadeOnly { from { opacity: 0; } }

            <div class="gauge"><span class="zone" style="left:${50 - z}%;width:${2 * z}%"></span><span class="mid"></span><span class="needle"></span></div>
            <div class="tn-bot"><span class="res2">맞히면 성공 +${T.bonus}%p</span><button class="tn-skip" type="button">건너뛰기</button></div>`;
        const needle = box.querySelector('.needle'), t0 = performance.now() - Math.random() * T.period * 1000;
        const pos = now => { const p = ((now - t0) / 1000 / T.period) % 1; return p < 0.5 ? -1 + 4 * p : 3 - 4 * p; };
        let raf = 0, done = false;
        const loop = now => { needle.style.left = (50 + pos(now) * 46) + '%'; raf = requestAnimationFrame(loop); };
        raf = requestAnimationFrame(loop);
        const go = $('#go'); if (go) { go.classList.add('now'); go.innerHTML = '지금! <small>탭</small>'; }
        tuning = skip => {
            if (done) return; done = true; tuning = null; cancelAnimationFrame(raf);
            const x = pos(performance.now()), hit = !skip && Math.abs(x) <= T.zone;
            needle.style.left = (50 + x * 46) + '%';
            const r = box.querySelector('.res2');
            r.className = 'res2 ' + (hit ? 'hit' : 'miss');
            r.textContent = skip ? '튜닝 건너뜀' : hit ? `딱 맞았다! 성공 +${T.bonus}%p` : '살짝 빗나갔다';
            if (!skip) sfx(hit ? 'hit' : 'miss');
            setTimeout(() => { box.hidden = true; res(hit ? T.bonus : 0); }, skip ? 120 : 420);
        };
        box.querySelector('.tn-skip').addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); tuning && tuning(true); });
    });
}
$('#stage').addEventListener('pointerdown', e => { if (tuning && !e.target.closest('.tn-skip')) { e.preventDefault(); tuning(false); } });
$('#bench').addEventListener('pointerdown', e => { if (tuning && e.target.closest('#go')) { e.preventDefault(); tuning(false); } });

// 강화 기다림(결과는 이미 정해져 저장됐다) — 두근두근하는 맛. 단계가 높을수록 길고, +10부터는 결과 직전에 한 박자 숨을 멈춘다
//   2026-11-12 사용자: 너무 빠르다 → 3초 → "좀 더 길어도" → 기본 4초, 높은 단계는 조금 더 (맨 처음 0.45 · 1 · 1.4 · 1.9 · 2.4초)
//   2026-11-12 사용자: +6까지는 사알짝 줄이자 → +0~+6 3.3초 (예전 +0~4 4초 · +5~9 4.5초)
//   2026-11-12 사용자: +8 전까지는 조금 더 짧게 → +0~+7 2.5초
const WAIT_MS = lv => lv <= 7 ? 2500 : lv < 10 ? 4500 : lv < 15 ? 5000 : 5500;
const WAIT_TXT = lv => lv < 5 ? '강화 중…' : lv < 10 ? '두근두근…' : lv < 15 ? '제발…' : '숨 참는 중…';
function gather() {   // 빛 알갱이가 기타로 모인다
    const d = document.createElement('i'), sz = 3 + Math.round(Math.random() * 4);
    const a = Math.random() * Math.PI * 2, r = 120 + Math.random() * 80;
    d.className = 'pt';
    d.style.cssText = `left:50%;top:54%;width:${sz}px;height:${sz}px;background:${one(['#ffe27a', '#ffffff', '#72c492', '#ffd23f'])}`;
    $('#fx').appendChild(d);
    d.animate([{ transform: `translate(calc(-50% + ${Math.round(Math.cos(a) * r)}px), calc(-50% + ${Math.round(Math.sin(a) * r)}px))`, opacity: 0 }, { opacity: 1, offset: 0.35 }, { transform: 'translate(-50%, -50%)', opacity: 0 }],
        { duration: 520 + Math.random() * 200, easing: 'cubic-bezier(.5,0,.9,.6)', fill: 'forwards' }).onfinish = () => d.remove();
}
async function suspense(lv, o = {}) {   // o.find: 기타 찾기(그림자에서 기타가 태어난다) · o.ms · o.txt · o.hush
    const ms = o.ms || WAIT_MS(lv), st = $('#stage'), go = $('#go'), txt = o.txt || WAIT_TXT(lv);
    if (go) { go.classList.add('wait'); go.textContent = txt; }
    $('#bench').classList.add('wait');
    st.classList.add('charging');
    const bar = document.createElement('div');
    bar.className = 'cast'; bar.innerHTML = `<span>${txt}</span><em><i></i></em>`;
    st.appendChild(bar);
    bar.querySelector('i').animate([{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }], { duration: ms, easing: 'cubic-bezier(.35,.05,.65,1)', fill: 'forwards' });
    sfx('charge', lv, ms);
    // 떨림: 처음엔 살살, 끝으로 갈수록 세게 + 점점 밝아진다
    const amp = Math.min(1.5 + lv * 0.22, 6), N = Math.max(4, Math.round(ms / 50)), kf = [];
    const j = a => +((Math.random() * 2 - 1) * a).toFixed(1);
    for (let i = 0; i <= N; i++) {
        const k = i / N, a = amp * k * k;
        const glow = `drop-shadow(0 0 ${Math.round(4 + 14 * k)}px rgba(255, 226, 122, ${(0.3 + 0.6 * k).toFixed(2)}))`;
        kf.push(o.find
            ? { transform: `${CVT} translate(${j(a)}px, ${j(a * 0.5)}px) scale(${(0.9 + 0.1 * k).toFixed(3)})`, opacity: Math.min(1, k * 4), filter: `brightness(${(0.02 + 0.1 * k * k).toFixed(2)}) ${glow}` }
            : { transform: `${CVT} translate(${j(a)}px, ${j(a * 0.5)}px) rotate(${j(a * 0.4)}deg)`, filter: `brightness(${(1 + 0.8 * k * k).toFixed(2)}) ${glow}` });
    }
    const tg = o.el || cv;
    const an = tg.animate(o.el ? kf.map(f => ({ ...f, transform: f.transform.replace(CVT, 'translateX(-50%)') })) : kf, { duration: ms, easing: 'linear', fill: 'forwards' });
    const iv = setInterval(gather, lv >= 10 ? 45 : 70);
    await sleep(ms);
    clearInterval(iv);
    an.cancel();
    if (lv >= 10 || o.hush) {   // 결과 직전 한 박자: 소리도 떨림도 멈춘다
        tg.style.filter = o.find ? 'brightness(.12) drop-shadow(0 0 18px rgba(255, 226, 122, 0.9))' : 'brightness(1.6) drop-shadow(0 0 14px rgba(255, 226, 122, 0.85))';
        bar.querySelector('span').textContent = '……';
        await sleep(o.find ? 320 : 500);
        tg.style.filter = '';
    }
    st.classList.remove('charging'); bar.remove(); $('#bench').classList.remove('wait');
}

        <small>부서진 기타 조각 ${CASE_SHARDS}개 → 하드케이스 1개. 끼워 두면 부서짐을 한 번 막아 줘요. ${CASE_MAX}개까지 가질 수 있어요(조각은 따로 계속 모여요).</small><div class="shardbar"><i style="width:${Math.min(100, S.shards / CASE_SHARDS * 100)}%"></i></div></div>
        <button type="button" data-a="craft" ${S.shards >= CASE_SHARDS && S.cases < CASE_MAX ? '' : 'disabled'}>${S.cases >= CASE_MAX ? `가득 ${S.cases}/${CASE_MAX}` : S.shards >= CASE_SHARDS ? '만들기' : `조각 ${S.shards}/${CASE_SHARDS}`}</button></div>`;
    if (shopCat === 'bench') h += BENCHES.map(B => {
        const own = S.bskins.includes(B.id), use = S.bskin === B.id;
        return `<div class="item"><span class="ic skin" style="background-image:url(../images/play/gk/${B.src.replace('bg_', 'bgt_')})"></span><div class="it"><b>${B.name}</b><small>${B.desc}</small></div>
            ${use ? '<span class="own">쓰는 중</span>' : own ? `<button type="button" data-a="bskin" data-id="${B.id}">바꾸기</button>` : `<button type="button" data-a="bskin" data-id="${B.id}" ${S.gold >= B.price ? '' : 'disabled'}>${gf(B.price)}</button>`}</div>`;
    }).join('') + (BENCHES.length < 2 ? '<p class="note2">작업대 스킨 10개는 그림을 뽑아 오면 여기에 더해요(낮 공방·합주실·빈티지 가게·클럽 무대·한옥·눈 오두막·네온·해변·공연장·별빛 신전).</p>' : '');
    if (shopCat === 'arena') h += ARENAS.map(A => {
        const own = S.asks.includes(A.id), use = S.ask === A.id;
        return `<div class="item"><span class="ic apv ${A.img ? '' : `askin ask-${A.id}`}" ${A.img ? `style="background:#111 url(../images/play/gk/${A.img.replace('arena_', 'arenat_')}) center / cover"` : ''}><i class="fas fa-guitar"></i><i class="fas fa-guitar"></i></span><div class="it"><b>${A.name}</b><small>${A.desc}</small></div>
            ${use ? '<span class="own">쓰는 중</span>' : own ? `<button type="button" data-a="askin" data-id="${A.id}">바꾸기</button>` : `<button type="button" data-a="askin" data-id="${A.id}" ${S.gold >= A.price ? '' : 'disabled'}>${gf(A.price)}</button>`}</div>`;
    }).join('') + '<p class="note2">배틀할 때 내 싸움터 배경이에요. 기타 넥끼리 칼처럼 부딪쳐요.</p>';
    if (shopCat === 'skin') h += WALLS.map(W => {
        const own = S.skins.includes(W.id), use = S.skin === W.id;
        return `<div class="item"><span class="ic skin" style="background-image:url(../images/play/gk/${W.src})"></span><div class="it"><b>${W.name}</b><small>${W.desc}</small></div>
            ${use ? '<span class="own">쓰는 중</span>' : own ? `<button type="button" data-a="skin" data-id="${W.id}">바꾸기</button>` : `<button type="button" data-a="skin" data-id="${W.id}" ${S.gold >= W.price ? '' : 'disabled'}>${gf(W.price)}</button>`}</div>`;
    }).join('') + (WALLS.length < 2 ? '<p class="note2">다른 스킨은 그림이 생기면 더해요. 걸이는 컬렉션에서 잠긴 걸이를 눌러 열어요.</p>' : '');
    if (shopCat === 'rec') h += `<div class="stats">
        <div><b>+${st.best}</b><small>최고 단계</small></div><div><b>${st.tries.toLocaleString()}</b><small>강화</small></div><div><b>${st.boom.toLocaleString()}</b><small>부순 기타</small></div>
        <div><b>${st.keep.toLocaleString()}</b><small>끊은 줄</small></div><div><b>${st.saved.toLocaleString()}</b><small>케이스로 막음</small></div><div><b>${gf(st.earned)}</b><small>판 돈 (${st.sold}대)</small></div></div>
        <p class="note2">진행은 이 브라우저에 저장되고, 로그인하면 계정에도 저장돼서 다른 기기에서도 이어서 해요(맨 위 로그인). 놀이터 피크와 골드는 따로예요.</p>
        <button type="button" class="reset" data-a="reset">기록 지우고 처음부터</button>`;
    el.innerHTML = h;
}

// ---------- 누르기 ----------
$('#app').addEventListener('click', e => {
    const b = e.target.closest('[data-a], #go');
    if (!b || b.disabled) return;
    if (b.id === 'go') { if (!tuning) enhance(); return; }
    if (busy) return;
    const a = b.dataset.a, id = b.dataset.id;
    if (a === 'again') enhance();
    else if (a === 'shopcat') { shopCat = b.dataset.c; renderShop(); }
    else if (a === 'rerank') { const bt = btDay(); bt.rr = (bt.rr | 0) + 1; save(); rerankAnim = true; sfx('drop'); renderBattle(); toast('새 연습 상대가 왔어요'); }
    else if (a === 'gocase') { talkClear(); shopCat = 'case'; setTab('shop'); }   // 위 줄 조각 → 하드케이스 칩
    else if (a === 'dex') toast(`+${b.dataset.lv} ${FAMS[b.dataset.f].names[+b.dataset.lv]}`);
    else if (a === 'new') findGuitar(false);
    else if (a === 'newp') findGuitar(false, true);
    else if (a === 'buy1') findGuitar(true);
    else if (a === 'daily') $('#rDaily').click();
    else if (a === 'sell') sellBench();
    else if (a === 'toss') tossBench(b);
    else if (a === 'hang') hangBench();
    else if (a === 'brag') brag(S.bench);
    else if (a === 'case') { S.caseOn = !S.caseOn && S.cases > 0; save(); renderBench(); }
    else if (a === 'tune') { S.tuneOn = !S.tuneOn; save(); renderBench(); }
    else if (a === 'slot') {   // 2026-11-12 사용자: 누르고 다른 기타를 누르면 자리 바꾸기, 다시 누르면 선택 풀기
        if (!selId || !id && b.dataset.i == null) { if (id) { selId = id; renderRoom(); } return; }
        if (id === selId) { selId = ''; renderRoom(); return; }
        swapSpots(selId, id || '', b.dataset.i != null ? +b.dataset.i : null);
    }
    else if (a === 'gshare') { const g = [...S.wall, ...S.floor, ...S.store].find(x => x && x.id === id); if (g) brag(g); }
    else if (a === 'setrep') { const g = S.wall.find(x => x && x.id === id); if (!g || isSq(g)) { toast('앰프·멀티는 대표로 할 수 없어요'); return; } S.rep = id; save(); renderRoom(); toast('대표 기타로 정했어요'); }
    else if (a === 'take') {   // 작업대로(작업대 것은 제자리 → 다른 빈 자리 → 창고)
        const [g, i] = unplace(id); if (!g) return;
        const old = S.bench;
        if (old && !placeItem(old, i >= 0 ? i : null)) {
            if (S.store.length < STORE_MAX) { S.store.push(old); toast('작업대에 있던 것은 창고에 넣었어요'); }
            else { placeItem(g, i >= 0 ? i : null); toast(noRoomMsg(old)); renderRoom(); return; }
        }
        S.bench = g; selId = ''; save();
        setTab('bench'); sfx('drop');
    } else if (a === 'wsell') {
        const g = S.wall.find(x => x && x.id === id) || S.floor.find(x => x.id === id); if (!g) return;
        if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = gf(SELL[g.lv]) + '에 팔기?'; return; }
        unplace(id); S.gold += SELL[g.lv]; S.st.sold++; S.st.earned += SELL[g.lv];
        if (S.rep === g.id) S.rep = '';
        save(); sfx('sell'); renderRoom(); updBar(true); toast(`${full(g)}을(를) ${gf(SELL[g.lv])}에 팔았어요`);
    } else if (a === 'stake' || a === 'shang' || a === 'ssell') {   // 창고
        const i = S.store.findIndex(g => g.id === id); if (i < 0) return;
        const g = S.store[i];
        if (a === 'stake') { if (S.bench) S.store[i] = S.bench; else S.store.splice(i, 1); S.bench = g; save(); setTab('bench'); sfx('drop'); return; }
        if (a === 'shang') {
            const where = placeItem(g); if (!where) { toast(noRoomMsg(g)); return; }
            S.store.splice(i, 1); save(); sfx('hang'); renderRoom(); toast(where === 'floor' ? '바닥에 놓았어요' : '벽에 걸었어요'); return;
        }
        if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = gf(SELL[g.lv]) + '에 팔기?'; return; }
        S.store.splice(i, 1); S.gold += SELL[g.lv]; S.st.sold++; S.st.earned += SELL[g.lv]; if (S.rep === g.id) S.rep = '';
        save(); sfx('sell'); renderRoom(); updBar(true); toast(`${full(g)}을(를) ${gf(SELL[g.lv])}에 팔았어요`);
    } else if (a === 'fight') fight(id);
    else if (a === 'findno') findNo(($('#vsno') || {}).value);
    else if (a === 'copyno') copyNo();
    else if (a === 'vslink') { const ni = $('#nick'); if (ni && !setNick(ni.value)) return; challengeLink(); }
    else if (a === 'buyT') {
        const n = +b.dataset.n, T = TUNERS[n];
        if (S.gold < T.price || S.tuner >= n) return;
        S.gold -= T.price; S.tuner = n; S.tuneOn = true; save(); sfx('sell'); renderShop(); toast(`${T.name}를 샀어요! 강화할 때 바늘을 맞춰요`);
    } else if (a === 'wopen') {   // 잠긴 걸이 열기: 한 번 누르면 '열까요?', 한 번 더 누르면 연다
        const i = +b.dataset.i, price = openPrice();
        if (S.open[i]) return;
        if (S.gold < price) { toast(`골드가 ${gf(price - S.gold)} 모자라요`); return; }
        if (b.dataset.sure !== '1') { document.querySelectorAll('.wsb.lock.sure').forEach(x => { x.classList.remove('sure'); x.dataset.sure = ''; x.querySelector('span').textContent = gs(price); }); b.dataset.sure = '1'; b.classList.add('sure'); b.querySelector('span').textContent = '열까요?'; return; }
        S.gold -= price; S.open[i] = true; justOpened = i; save(); sfx('hang'); renderRoom(); updBar(true); toast('걸이를 열었어요! 조명이 켜졌어요');
    } else if (a === 'skin') {
        const W = WALLS.find(w => w.id === b.dataset.id); if (!W) return;
        if (!S.skins.includes(W.id)) { if (S.gold < W.price) return; S.gold -= W.price; S.skins.push(W.id); sfx('sell'); }
        S.skin = W.id; save(); renderShop(); toast(`진열 벽을 '${W.name}'(으)로 바꿨어요`);
    } else if (a === 'askin') {
        const A = ARENAS.find(w => w.id === b.dataset.id); if (!A) return;
        if (!S.asks.includes(A.id)) { if (S.gold < A.price) return; S.gold -= A.price; S.asks.push(A.id); sfx('sell'); }
        S.ask = A.id; save(); renderShop(); toast(`싸움터를 '${A.name}'(으)로 바꿨어요`);
    } else if (a === 'bskin') {
        const B = BENCHES.find(w => w.id === b.dataset.id); if (!B) return;
        if (!S.bskins.includes(B.id)) { if (S.gold < B.price) return; S.gold -= B.price; S.bskins.push(B.id); sfx('sell'); }
        S.bskin = B.id; save(); applyBench(); renderShop(); toast(`작업대를 '${B.name}'(으)로 바꿨어요`);
    } else if (a === 'craft') {
        if (S.shards < CASE_SHARDS) return;
        if (S.cases >= CASE_MAX) { toast(`하드케이스는 ${CASE_MAX}개까지예요`); return; }
        S.shards -= CASE_SHARDS; S.cases++; save(); sfx('case'); renderShop(); toast('하드케이스를 만들었어요. 작업대에서 끼워요');
    } else if (a === 'reset') {
        if (!confirm('골드·기타·기록을 모두 지우고 처음부터 할까요? 되돌릴 수 없어요.')) return;
        S = fresh(); save(); setTab('bench'); start();
    }
});
$('#rDaily').addEventListener('click', () => {
    if (busy) return;
    if (S.daily === today()) { toast('오늘 출석은 했어요. 내일 또 와요!'); return; }
    S.daily = today(); S.gold += DAILY_GOLD; save(); updBar(true); sfx('sell');
    const pk = PLAY.picks.earn(DAILY_PICKS);   // 놀이터 하루 200 한도를 넘으면 0
    toast(`출석 +${gf(DAILY_GOLD)}${pk ? ` · 피크 +${pk}` : ' (피크는 오늘 한도를 다 받았어요)'}`);
    if (tab === 'bench') renderBench(); else if (tab === 'shop') renderShop();
});
$('#rSnd').addEventListener('click', () => { mem.set('gk.sound', !soundOn()); updBar(); if (soundOn()) sfx('hang'); });
$('#adw').innerHTML = PLAY.adSlot('wide');

addEventListener('ahnssam-auth-settled', () => cloudSync());
document.addEventListener('visibilitychange', () => { if (document.hidden && linked() && cloud.dirty) cloudPush(); });
function start() {
    applyBench();
    if (!S.intro) {
        S.intro = true; S.gold = Math.max(S.gold, START_GOLD); save();
        setTimeout(() => talk(PLAY.picks.bal() >= FIRST_PICKS ? LINES.intro : [...LINES.intro, ...(S.daily !== today() ? LINES.noPickDaily : LINES.noPick)]), 400);
    }
    if (VS) setTab('battle'); else setTab('bench');
}
addEventListener('pageshow', e => { if (e.persisted && !busy && tab === 'bench') renderBench(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !busy && tab === 'bench' && !S.bench) renderBench(); });
start();
setTimeout(cloudSync, 1200);
autoSync();   // 들어오면 한 번(마지막으로 온 날을 새로 해서 다른 사람의 상대 목록에 남게)
</script>
</body>
</html>
