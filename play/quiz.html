<style>
    .hero { text-align: center; padding: 34px 0 6px; }
    .hero h1 { font-size: clamp(24px, 4.4vw, 36px); font-weight: 900; letter-spacing: -0.02em; }
    .hero h1 em { font-style: normal; color: var(--green-deep); }
    .hero p { color: var(--sub); margin-top: 6px; font-size: 14.5px; }
    .modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 24px; }
    .mode { padding: 0 20px 20px; text-align: left; display: flex; flex-direction: column; gap: 8px; overflow: hidden; transition: transform .2s, box-shadow .2s; }
    .mode:hover { transform: translateY(-3px); box-shadow: 0 2px 0 var(--green-pale), 0 14px 34px rgba(42, 107, 74, 0.14); }
    .mode .mthumb { position: relative; display: block; height: 168px; margin: 0 -20px 8px; }
    .mode:hover .th-tab .sheet { transform: translate(-50%, -52%) rotate(-1deg) scale(1.03); }
    .mode h2 { font-size: 19px; font-weight: 900; }
    .mode p { color: #555; font-size: 13.5px; }
    .mode .meta { font-size: 12px; color: var(--sub); display: flex; gap: 10px; margin-top: auto; padding-top: 6px; }
    .mode .go { font-weight: 700; color: var(--green-deep); font-size: 14px; }

    /* 문제 */
    .qhd { display: flex; align-items: center; gap: 12px; padding: 18px 0 8px; flex-wrap: wrap; }
    .qhd .md { font-weight: 900; color: var(--green-deep); }
    .qhd .no { font-weight: 700; }
    .qhd .sp { flex: 1; }
    .qhd .sc { font-weight: 700; }
    .qhd .sc b { color: var(--green-deep); font-size: 16px; }
    .qhd .ok { font-size: 13px; color: var(--sub); }
    .qhd .streak { font-size: 13px; color: #e06a2a; font-weight: 700; }
    .timer { height: 8px; background: #dfe7e2; border-radius: 99px; overflow: hidden; }
    .timer i { display: block; height: 100%; width: 100%; background: var(--green-mid); transform-origin: left; }
    .timer.warn i { background: #e9a23b; }
    .qbox { margin-top: 14px; padding: 22px; text-align: center; }
    .qbox .ask { font-size: clamp(18px, 3vw, 23px); font-weight: 900; line-height: 1.45; }
    .qbox .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--green-faint); color: var(--green-deep); margin-bottom: 10px; }
    .song { font-size: clamp(22px, 4vw, 32px); font-weight: 900; margin: 6px 0 4px; }
    .tabcrop { margin: 14px auto 0; max-width: 820px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #fff; position: relative; }
    .tabcrop .strip { overflow: hidden; }
    .tabcrop .strip + .strip { border-top: 1px dashed var(--line); }
    .tabcrop img { width: 100%; max-width: none; display: block; transition: margin .35s, width .35s; }
    .tabcrop .lbl { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: #9aa59f; background: rgba(255,255,255,.85); padding: 1px 6px; border-radius: 6px; }
    .hints { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
    .hint { font-size: 13px; color: var(--green-deep); font-weight: 700; padding: 6px 12px; border-radius: 999px; border: 1px dashed var(--green-mid); background: #fff; }
    .hint small { font-weight: 500; color: var(--sub); margin-left: 2px; }
    .hint[disabled] { color: #666; border-style: solid; border-color: var(--line); cursor: default; }
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    .choices button { background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 14px 14px; font-size: 15.5px; font-weight: 700; text-align: left; display: flex; align-items: center; gap: 10px; transition: border-color .15s, background .15s; }
    .choices button:hover:not([disabled]) { border-color: var(--green-mid); background: #fbfefc; }
    .choices button .k { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: #f1f4f2; font-size: 13px; color: #666; }
    .choices button.ok { border-color: var(--green-mid); background: var(--green-faint); }
    .choices button.ok .k { background: var(--green-mid); color: #fff; }
    .choices button.no { border-color: var(--red); background: #fdeeee; }
    .choices button.no .k { background: var(--red); color: #fff; }
    .choices button[disabled] { cursor: default; }
    @media (max-width: 640px) { .choices { grid-template-columns: 1fr; } .qbox { padding: 16px 12px; } }
    .fb { margin-top: 14px; padding: 14px 16px; border-radius: 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .fb.ok { background: var(--green-faint); }
    .fb.no { background: #fdeeee; }
    .fb .t { font-weight: 900; font-size: 16px; }
    .fb .t em { font-style: normal; font-size: 13px; color: var(--green-deep); margin-left: 4px; }
    .fb .x { flex: 1 1 260px; font-size: 13.5px; color: #333; }
    .fb .x a { color: var(--green-deep); font-weight: 700; text-decoration: underline; }
    .fb .btn { padding: 10px 18px; }
    .cover { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; }

    /* 기타 상식 난이도 고르기 */
    .lvs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 22px; }
    .lv { position: relative; padding: 22px 18px 18px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; border-top: 6px solid var(--c); transition: transform .2s, box-shadow .2s; }
    .lv:hover { transform: translateY(-4px); box-shadow: 0 2px 0 var(--green-pale), 0 14px 34px rgba(42, 107, 74, 0.14); }
    .lv .em { font-size: 46px; line-height: 1; }
    .lv .stars { color: var(--c); font-size: 15px; letter-spacing: 2px; }
    .lv .stars i { font-style: normal; color: #dfe4e1; }
    .lv b { font-size: 24px; font-weight: 900; color: var(--c); }
    .lv small { font-size: 14px; font-weight: 700; color: #333; }
    .lv .ex { font-size: 12.5px; color: var(--sub); line-height: 1.5; }
    .lv .go { margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--green-deep); }
    .lv-back { text-align: center; margin-top: 18px; }
    .lvtag { font-size: 12px; font-weight: 800; color: #fff; background: var(--c); padding: 2px 8px; border-radius: 999px; margin-left: 4px; vertical-align: 1px; }
    @media (max-width: 640px) {
        .lvs { grid-template-columns: 1fr; gap: 10px; }
        .lv { display: grid; grid-template-columns: 44px 1fr auto; grid-template-areas: "em b st" "em sm sm" "em ex ex" "em go go"; text-align: left; align-items: center; padding: 14px 16px; border-top: 0; border-left: 6px solid var(--c); gap: 2px 12px; }
        .lv .em { grid-area: em; font-size: 34px; align-self: start; }
        .lv b { grid-area: b; font-size: 20px; }
        .lv .stars { grid-area: st; }
        .lv small { grid-area: sm; } .lv .ex { grid-area: ex; } .lv .go { grid-area: go; margin-top: 2px; }
    }
    .snd { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: #667; font-size: 13px; display: grid; place-items: center; }

    /* 정답·오답 연출 (연습도구 '코드 진행 청음'과 같은 느낌) — 정답: 팡! 튀어오르며 초록 빛 / 오답: 부들부들 흔들리고 축 처짐 */
    .qbox { position: relative; }
    .choices button { position: relative; }
    @keyframes qHit {
        0% { transform: scale(1); filter: none; }
        30% { transform: scale(1.1); filter: drop-shadow(0 0 16px rgba(114, 196, 146, 0.95)); }
        55% { transform: scale(0.96); }
        75% { transform: scale(1.03); }
        100% { transform: scale(1); filter: none; }
    }
    @keyframes qMiss {
        0%, 100% { transform: translateX(0); }
        10% { transform: translateX(-10px) rotate(-1deg); }
        20% { transform: translateX(10px) rotate(1deg); }
        30% { transform: translateX(-8px); }
        40% { transform: translateX(8px); }
        50% { transform: translateX(-5px); }
        60% { transform: translateX(4px); }
        75% { transform: translateY(6px) rotate(0.6deg); filter: grayscale(0.4) brightness(0.92); }
        90% { transform: translateY(4px); }
    }
    @keyframes qReveal { 0%, 100% { box-shadow: 0 0 0 0 rgba(66, 168, 84, 0); } 35%, 65% { box-shadow: 0 0 0 6px rgba(66, 168, 84, 0.4); } }
    .choices button.fx-hit, .fb.fx-hit { animation: qHit .6s cubic-bezier(.3, 1.6, .5, 1); }
    .choices button.fx-miss, .fb.fx-miss { animation: qMiss .9s ease-out; }
    .choices button.fx-reveal { animation: qReveal 1.1s ease-in-out .5s both; }
    .choices button.ok { z-index: 1; }
    .plus { position: absolute; right: 14px; top: 50%; font-size: 18px; font-weight: 900; color: var(--green-deep); pointer-events: none; animation: plusUp 1.2s ease-out forwards; }
    @keyframes plusUp { 0% { transform: translateY(-50%) scale(.6); opacity: 0; } 20% { transform: translateY(-90%) scale(1.2); opacity: 1; } 100% { transform: translateY(-230%) scale(1); opacity: 0; } }
    /* 큰 ⭕ / ❌ 도장 */
    .stamp { position: absolute; left: 50%; top: 50%; width: var(--s); height: var(--s); margin: calc(var(--s) / -2) 0 0 calc(var(--s) / -2); pointer-events: none; z-index: 5; animation: stamp 1.3s ease-out forwards; --s: clamp(110px, 22vw, 170px); }
    .stamp.o { border: calc(var(--s) * 0.12) solid rgba(66, 168, 84, 0.88); border-radius: 50%; box-shadow: 0 0 30px rgba(66, 168, 84, 0.35); }
    .stamp.x::before, .stamp.x::after { content: ''; position: absolute; left: -8%; top: 50%; width: 116%; height: calc(var(--s) * 0.13); margin-top: calc(var(--s) * -0.065); background: rgba(224, 64, 64, 0.88); border-radius: 99px; transform: rotate(45deg); }
    .stamp.x::after { transform: rotate(-45deg); }
    @keyframes stamp { 0% { transform: scale(2.3); opacity: 0; } 16% { transform: scale(.9); opacity: 1; } 28% { transform: scale(1.05); } 38% { transform: scale(1); } 72% { opacity: 1; } 100% { transform: scale(1.06); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
        .choices button.fx-hit, .fb.fx-hit, .choices button.fx-miss, .fb.fx-miss, .choices button.fx-reveal, .plus { animation: none; }
        .stamp { animation: none; opacity: .9; }
    }

    /* 결과 */
    .res { text-align: center; padding: 26px 0 0; }
    .res .md { font-weight: 700; color: var(--sub); }
    .res .score { font-size: clamp(54px, 10vw, 84px); font-weight: 900; line-height: 1.1; color: var(--green-deep); font-family: 'Arial Black', 'Noto Sans KR', sans-serif; }
    .res .score small { font-size: .4em; color: #aaa; }
    .res .pts { font-size: 17px; font-weight: 900; color: #333; }
    .res .rank { font-size: clamp(22px, 4vw, 30px); font-weight: 900; margin-top: 6px; }
    .board { max-width: 520px; margin: 12px auto 0; padding: 10px 14px; border-radius: 12px; background: #fff; border: 1px solid var(--line); font-size: 14px; }
    .board b { color: var(--green-deep); }
    .board:empty { display: none; }
    .res .cm { color: #555; margin-top: 4px; }
    .res .btns { margin-top: 18px; }
    .review { max-width: 760px; margin: 8px auto 0; text-align: left; padding: 8px 16px; }
    .review h3 { font-size: 15px; font-weight: 900; padding: 8px 0; }
    .review li { list-style: none; display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
    .review li i { margin-top: 3px; }
    .review li .fa-circle-check { color: var(--green-mid); }
    .review li .fa-circle-xmark { color: var(--red); }
    .review li small { display: block; color: var(--sub); }
    .res .rec { max-width: 860px; margin-left: auto; margin-right: auto; }
</style>

<script>
const { esc, shuffle, adSlot, interstitial, share, catalog, previews, rpc, mem, pvUrl, cvUrl, STYLE, baseTitle, recRow } = PLAY;
const app = document.getElementById('app');
const N = 10;   // 한 판 문제 수

// 기타 상식 문제는 trivia.js (window.TRIVIA)
const TRIVIA = window.TRIVIA || [];

// ---------- 퀴즈 종류 ----------
const MODES = {
    tab: { name: '악보 보고 노래 맞히기', icon: 'fa-guitar', color: '#42a854', sec: 30, desc: '안쌤 악보의 한 줄만 보여 줘요. 코드와 TAB만 보고 무슨 곡인지 맞혀 보세요. 막히면 한 줄 더 보기 · 가수 힌트!', meta: '10문제 · 30초 · 힌트 2개' },
    artist: { name: '이 노래 누구 노래?', icon: 'fa-microphone', color: '#52a6f2', sec: 12, desc: '곡 제목을 보고 부른 가수(연주자)를 골라요. 안쌤 악보와 요즘 기타 유튜브 인기곡에서 나와요.', meta: '10문제 · 12초' },
    trivia: { name: '기타 상식 퀴즈', icon: 'fa-lightbulb', color: '#eaac14', sec: 15, desc: '튜닝, 코드, 주법, 장비, 전설의 기타리스트까지. 초보 · 중수 · 고수 중 내 실력에 맞게 골라요!', meta: '10문제 · 15초 · 난이도 3단계' },
};
// 기타 상식 난이도 (2026-11-08 사용자 요청: 초보 · 중수 · 고수) — trivia.js 의 lv
const LV = {
    1: { name: '초보', em: '🌱', c: '#42a854', who: '기타를 막 시작했어요', ex: '줄 이름 · 기본 코드 · TAB 읽기 · 누구나 아는 곡' },
    2: { name: '중수', em: '🎸', c: '#e39b12', who: '코드 잡고 곡 좀 쳐 봤어요', ex: '주법 · 이펙터 · 박자 · 유명 기타리스트' },
    3: { name: '고수', em: '🔥', c: '#e0553a', who: '이론·장비·역사까지 빠삭해요', ex: '모드 · 텐션 코드 · 픽업 · 전설의 뒷이야기' },
};
const lvCount = l => TRIVIA.filter(t => t.lv === l).length;
const modeName = g => g.m.name + (g.lv ? ` · ${LV[g.lv].name}` : '');
// 점수: 맞히면 100점 + 빨리 맞힐수록 최대 50점, 힌트 하나에 30점 빼기(맞히면 최소 30점)
const HINT_COST = 30;
const points = (left, hints) => Math.max(30, 100 + Math.round(50 * left) - HINT_COST * hints);
const RANK = [
    [10, '🏆 기타 신(神)', '더 가르칠 게 없네요. 안쌤 자리를 노리는 중?'],
    [8, '🔥 무대 체질', '이 정도면 버스킹 나가도 되겠어요!'],
    [6, '🎸 합주실 단골', '꽤 치시는데요? 조금만 더 하면 고수!'],
    [3, '🎵 코드 좀 잡는 사람', '기본은 있어요. 악보 한 곡 끝까지 쳐 보는 건 어때요?'],
    [0, '🌱 기타 새싹', '괜찮아요, 다들 여기서 시작해요. 안쌤이랑 같이 해요!'],
];

function start() {
    G = null;
    history.replaceState(null, '', location.pathname);
    app.innerHTML = `<section class="hero"><h1>안쌤의 <em>기타 퀴즈쇼</em></h1><p>10문제로 알아보는 내 기타 레벨. 친구랑 점수 내기 해 보세요!</p></section>
        <div class="modes">${Object.entries(MODES).map(([k, m]) => `<button class="mode card" data-m="${k}">
            <span class="mthumb">${PLAY.thumb(k, { count: k === 'trivia' ? TRIVIA.length : 0 })}</span>
            <h2>${esc(m.name)}</h2><p>${esc(m.desc)}</p>
            <span class="meta"><span>${esc(m.meta)}</span><span class="sp" style="flex:1"></span><span class="go">시작 →</span></span></button>`).join('')}</div>
        ${adSlot('wide')}`;
    app.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => (b.dataset.m === 'trivia' ? pickLevel() : begin(b.dataset.m))));
    scrollTo(0, 0);
}
// 기타 상식: 난이도 고르기
function pickLevel() {
    G = null;
    history.replaceState(null, '', '?m=trivia');
    app.innerHTML = `<section class="hero"><h1>기타 상식 <em>퀴즈</em></h1><p>내 실력에 맞는 난이도를 골라요. 10문제 · 15초</p></section>
        <div class="lvs">${[1, 2, 3].map(l => `<button class="lv card" data-lv="${l}" style="--c:${LV[l].c}">
            <span class="em">${LV[l].em}</span><span class="stars">${'★'.repeat(l)}<i>${'★'.repeat(3 - l)}</i></span>
            <b>${LV[l].name}</b><small>${esc(LV[l].who)}</small><span class="ex">${esc(LV[l].ex)}</span>
            <span class="go">${lvCount(l)}문제 중 10문제 · 시작 →</span></button>`).join('')}</div>
        <p class="lv-back"><button class="btn ghost" id="back"><i class="fas fa-arrow-left"></i>다른 퀴즈</button></p>`;
    app.querySelectorAll('[data-lv]').forEach(b => b.addEventListener('click', () => begin('trivia', +b.dataset.lv)));
    document.getElementById('back').onclick = start;
    scrollTo(0, 0);
}

// ---------- 문제 만들기 ----------
const nfc = s => String(s || '').normalize('NFC').trim();
const key = s => nfc(s).toLowerCase().replace(/[\s.,'’!?&()-]/g, '');
// 문제·보기에 쓰는 곡 이름: 판·콘텐츠 표시는 모두 뺀다 — 답이 드러나거나 곡 이름이 아닌 것이라서
//   [후반부 리프] [안쌤 ver.] 같은 대괄호, (순한맛 vs 매운맛) (2025 편곡) (인트로) (귀멸의 칼날 OST) 같은 한글·OST 괄호,
//   끝의 "매운맛 & 지옥의 불맛" "천상계맛" "1일 vs 10년" "OO 파트" "쉽게". "(Itte)" "(I Feel Good)" 처럼 원래 제목의 영어 괄호는 둔다
const qTitle = t => nfc(t)
    .replace(/\s*\[[^\]]*\]/g, ' ')
    .replace(/\s*\(([^)]*)\)/g, (m, x) => (/[^\x00-\x7f]|OST|vs|ver|world/i.test(x) ? ' ' : m))
    .replace(/\s+\S*맛(\s.*)?$/, '')
    .replace(/\s+\d+\s*일(차)?\s*vs\s*\d+\s*년(차)?\s*$/i, '')     // 1일 vs 10년
    .replace(/\s+\S+\s*파트\s*$/, '')                                 // 이찬혁 파트
    .replace(/\s+쉽게\s*$/, '')
    .replace(/\s+/g, ' ').trim();
// 악보 보고 맞히기에서 뺄 곡: 곡이 아니라 연습용 진행
// 노래가 아닌 것은 안 낸다 (2026-11-08 사용자 결정: 실제 노래만) — 연습용 진행, 브금·테마곡·영화 음악, 밈·어린이 콘텐츠
const NOT_SONG = /^neo soul progression$|브금|bgm|테마|theme|anthem|^원령공주 ost$|미션 임파서블|mission impossible|he's a pirate|way back then|the last waltz|에어맨|뽀로로/i;
const NOT_SONG_ARTIST = /크레용 신짱|스펀지밥|명탐정 코난|20세기 폭스|스타워즈|마블|한스 짐머|hans zimmer|랄로 쉬프린|에어맨|뽀로로/i;
const isSong = s => !NOT_SONG.test(nfc(s.title)) && !NOT_SONG_ARTIST.test(nfc(s.artist || ''));
const EXT = window.EXT_SONGS || [];

// 같은 곡·가수를 다르게 적은 것("Kotaro Oshio" ↔ "코타로 오시오 Kotaro Oshio", "황혼" ↔ "황혼 Twilight")은 같은 걸로 본다
const alike = (a, b) => { const x = key(a), y = key(b); return !!x && !!y && (x.includes(y) || y.includes(x)); };
// 오답 보기 3개: 정답이나 서로 비슷한 이름은 건너뛴다
function pickOthers(cands, ans) {
    const out = [];
    for (const c of cands) {
        if (out.length >= 3) break;
        if (!alike(c, ans) && !out.some(o => alike(o, c))) out.push(c);
    }
    return out;
}

// 최근에 낸 문제는 뒤로 미룬다 (이 브라우저에서 최근 30개)
function fresh(list, id, mode) {
    const seen = new Set(mem.get('quiz.seen.' + mode, []));
    return [...list.filter(x => !seen.has(id(x))), ...list.filter(x => seen.has(id(x)))];
}
function remember(mode, ids) {
    const old = mem.get('quiz.seen.' + mode, []).filter(x => !ids.includes(x));
    mem.set('quiz.seen.' + mode, [...old, ...ids].slice(-30));
}

// 미리보기 그림에서 TAB 줄(보표) 찾기 — 연한 회색 가로줄 6개(베이스는 4개)가 모이면 한 줄.
// 줄 아래 음표 기둥 수와 줄 안 숫자 잉크를 세서, 쉼표만 있는 줄(인트로 쉼 등)은 건너뛴다.
function analyze(img) {
    const W = img.naturalWidth, H = img.naturalHeight;
    if (!W || !H) return null;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, H); cx.drawImage(img, 0, 0);
    const px = cx.getImageData(0, 0, W, H).data, g = new Uint8Array(W * H);
    for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (px[j] + px[j + 1] + px[j + 2]) / 3;
    const x0 = 30, x1 = W - 30, span = x1 - x0;
    const ys = [];
    for (let y = 0; y < H; y++) {
        let l = 0, b = 0;
        for (let o = y * W + x0, e = y * W + x1; o < e; o++) { const v = g[o]; if (v < 235) l++; if (v < 120) b++; }
        if (l > span * 0.6 && b < span * 0.3) ys.push(y);   // 회색 보표 줄(검은 빔은 빼기)
    }
    const lines = [];
    ys.forEach(y => { const L = lines[lines.length - 1]; if (L && y - L.b <= 2) L.b = y; else lines.push({ a: y, b: y }); });
    let groups = [];
    lines.map(L => (L.a + L.b) / 2).forEach(y => { const G = groups[groups.length - 1]; if (G && y - G[G.length - 1] <= 18) G.push(y); else groups.push([y]); });
    groups = groups.filter(G => G.length >= 4);
    if (!groups.length) return null;
    const cnt = {}; groups.forEach(G => { cnt[G.length] = (cnt[G.length] || 0) + 1; });
    const n = Math.min(6, +Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || b - a)[0]);
    const staves = [];
    groups.forEach(G => {
        if (G.length < n) return;                 // 아래가 잘린 줄
        let best = 0, bestSpread = Infinity;       // 줄이 더 잡혔으면(괄호선 등) 간격이 가장 고른 n개
        for (let i = 0; i + n <= G.length; i++) {
            const gaps = G.slice(i + 1, i + n).map((y, k) => y - G[i + k]);
            const spread = Math.max(...gaps) - Math.min(...gaps);
            if (spread < bestSpread) { bestSpread = spread; best = i; }
        }
        staves.push({ top: Math.round(G[best]), bot: Math.round(G[best + n - 1]) });
    });
    if (!staves.length) return null;
    const xa = 80, xb = W - 20;
    staves.forEach(s => {
        let stems = 0, prev = false;               // 줄 바로 아래 음표 기둥 수
        for (let x = xa; x < xb; x++) {
            let d = false;
            for (let y = s.bot + 4; y < Math.min(H, s.bot + 12) && !d; y++) d = g[y * W + x] < 170;
            if (d && !prev) stems++;
            prev = d;
        }
        let ink = 0;                               // 줄 안 숫자(마디줄 빼고)가 차지한 칸 수
        const ya = Math.max(0, s.top - 3), yb = Math.min(H, s.bot + 4), hh = yb - ya;
        for (let x = xa; x < xb; x++) {
            let c = 0;
            for (let y = ya; y < yb; y++) if (g[y * W + x] < 120) c++;
            if (c && c < hh * 0.8) ink++;
        }
        s.stems = stems; s.ink = ink;
    });
    // 아래 끝: 음표 기둥·빔이 끝나고 빈 줄이 두 번 나오는 곳 — 그 아래 가사가 있어도(답이 보이니) 자른다
    const empty = y => { for (let o = y * W + xa, e = y * W + xb; o < e; o++) if (g[o] < 150) return false; return true; };
    staves.forEach(s => {
        let y = s.bot + 8;
        while (y < Math.min(H - 1, s.bot + 46) && !(empty(y) && empty(y + 1))) y++;
        s.end = y + 2;
    });
    staves.forEach((s, i) => {
        const p = staves[i - 1], q = staves[i + 1];
        s.t = Math.max(s.top - 58, p ? p.bot + 46 : 102);   // 위: 코드 이름·구간 표시까지 (맨 위 줄은 제목·가수 아래부터)
        s.b = Math.min(s.end, s.bot + 46, q ? q.top - 30 : H);
    });
    let pick = staves.findIndex(s => s.stems >= 8 && s.ink >= 100);
    if (pick < 0) pick = staves.reduce((m, s, i) => (s.stems * 10 + s.ink > staves[m].stems * 10 + staves[m].ink ? i : m), 0);
    return { W, H, staves, pick };
}
function loadSheet(s) {
    return new Promise((res, rej) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => { try { const a = analyze(img); a ? res({ s, a }) : rej(new Error('no staff')); } catch (e) { rej(e); } };
        img.onerror = () => rej(new Error('load'));
        img.src = pvUrl(s);
    });
}

async function build(mode, lv) {
    if (mode === 'trivia') {
        const list = fresh(shuffle(TRIVIA.filter(t => !lv || t.lv === lv)), t => t.q, mode).slice(0, N);
        return list.map(t => ({ id: t.q, ask: t.q, a: t.a, opts: shuffle([t.a, ...t.w]), x: t.x }));
    }
    if (mode === 'tab') {
        // 같은 곡은 하나만 — 반주·핑거 악보를 먼저(솔로·베이스는 곡 처음이 아니라 알아보기 어려움). 코드악보·자작곡은 뺌
        const rows = (await previews()).filter(s => s.kind !== 'original' && s.style !== 'chord' && isSong(s) && !/안쌤|기타나무숲/.test(s.artist || ''));
        const pref = s => ({ electric: 0, fingerstyle: 0, acoustic: 1, solo: 2, bass: 3 }[s.style] ?? 4);
        const uniq = new Map();
        shuffle(rows).sort((a, b) => pref(a) - pref(b)).forEach(s => { const k = key(qTitle(s.title)); if (k && !uniq.has(k)) uniq.set(k, s); });
        const songs = [...uniq.values()];
        const order = fresh(shuffle(songs), s => key(qTitle(s.title)), mode);
        const got = [];
        for (let i = 0; i < order.length && got.length < N; ) {      // 그림을 읽어 보표를 못 찾으면 다음 곡
            const part = order.slice(i, i + (N - got.length) + 2);
            i += part.length;
            (await Promise.all(part.map(s => loadSheet(s).catch(() => null)))).forEach(x => { if (x && got.length < N) got.push(x); });
        }
        const grp = s => (s.style === 'fingerstyle' ? 'f' : 'b');      // 오답은 같은 느낌(핑거 ↔ 밴드) 곡에서 먼저
        return got.map(({ s, a: an }) => {
            const a = qTitle(s.title);
            const same = shuffle(songs.filter(o => o !== s && grp(o) === grp(s))), diff = shuffle(songs.filter(o => o !== s && grp(o) !== grp(s)));
            const others = pickOthers([...same, ...diff].map(o => qTitle(o.title)), a);
            return { id: key(a), ask: '이 악보, 무슨 곡일까?', a, opts: shuffle([a, ...others]), song: s, an, hint: nfc(s.artist) };
        });
    }
    // artist: 가수 칸에 괄호(OST·원곡 설명)가 없고 진짜 가수·연주자인 곡만 — 'OO OST', '안쌤의 기타나무숲', 영화사 이름은 빼서 정답이 헷갈리지 않게
    const rows = (await catalog()).filter(s => s.artist && !/[()]/.test(s.artist) && !/OST|안쌤|기타나무숲|폭스|fox/i.test(s.artist) && s.kind !== 'original' && isSong(s)
        && !key(s.title).includes(key(s.artist)));      // "뽀로로 - 노는게 제일 좋아"처럼 제목에 답이 든 곡은 빼기
    const uniq = new Map();
    shuffle(rows).forEach(r => { const k = key(qTitle(r.title)); if (k && !uniq.has(k)) uniq.set(k, r); });
    const songs = fresh([...uniq.values()], s => key(qTitle(s.title)), mode);
    // 1/3 정도는 다른 기타 채널(하루한곡·그랩더기타)이 요즘 많이 치는 곡 — 안쌤 악보에 이미 있는 곡은 빼고
    const ext = fresh(shuffle(EXT.filter(e => !uniq.has(key(qTitle(e.t))) && ![...uniq.keys()].some(k => alike(k, key(e.t))))), e => key(e.t), mode);
    const nExt = Math.min(ext.length, Math.round(N / 3) + (Math.random() < 0.33 ? 1 : 0));
    const artists = [];
    const addArtist = (name, genre) => { if (!artists.some(x => alike(x.name, name))) artists.push({ name, genre }); };
    rows.forEach(r => addArtist(nfc(r.artist), r.genre));
    EXT.forEach(e => addArtist(e.a, ''));
    const fromSite = songs.slice(0, N - nExt).map(s => {
        const a = nfc(s.artist);
        const same = shuffle(artists.filter(x => x.genre === s.genre)), any = shuffle(artists.filter(x => x.genre !== s.genre));
        const others = pickOthers([...same, ...any].map(x => x.name), a);
        return { id: key(qTitle(s.title)), ask: '', title: qTitle(s.title), chip: `${s.genre || ''}${s.genre ? ' · ' : ''}${STYLE[s.style] || ''} 악보`, a, opts: shuffle([a, ...others]), song: s };
    });
    const fromExt = ext.slice(0, nExt).map(e => {
        const others = pickOthers(shuffle(artists).map(x => x.name), e.a);
        return { id: key(e.t), ask: '', title: e.t, chip: '요즘 기타 유튜브 인기곡', a: e.a, opts: shuffle([e.a, ...others]) };
    });
    return shuffle([...fromSite, ...fromExt]);
}

// ---------- 진행 ----------
let G = null, timer = null;
async function begin(mode, lv = 0) {
    if (mode !== 'trivia') lv = 0;
    history.replaceState(null, '', `?m=${mode}${lv ? `&lv=${lv}` : ''}`);
    G = null;
    app.innerHTML = `<p style="text-align:center;padding:60px 0;color:#888"><i class="fas fa-spinner fa-spin"></i> 문제를 고르는 중…</p>`;
    let qs;
    try { qs = await build(mode, lv); if (qs.length < 4) throw new Error('few'); }
    catch (e) { app.innerHTML = `<p style="text-align:center;padding:60px 0">문제를 불러오지 못했어요. <a href="" style="text-decoration:underline">다시 시도</a></p>`; return; }
    remember(mode, qs.map(q => q.id));
    G = { mode, lv, m: MODES[mode], qs, i: 0, score: 0, pts: 0, streak: 0, log: [] };
    ask();
}
// 악보 자르기: 그림에서 [t, b] 구간만 같은 비율로 (그림 폭 = 상자 폭). 한 줄 더 보면 다음 줄(없으면 앞 줄)을 따로 붙인다
// 휴대폰(좁은 화면)에서는 한 줄을 왼쪽·오른쪽 반으로 나눠 위아래로 — 숫자가 두 배 크게 보이게
const NARROW = () => matchMedia('(max-width: 640px)').matches;
function strip(q, st) {
    const W = q.an.W, h = Math.max(30, st.b - st.t);
    return (NARROW() ? [[0, 0.53], [0.47, 1]] : [[0, 1]]).map(([a, b]) => {
        const x0 = a * W, w = (b - a) * W;
        return `<div class="strip" style="aspect-ratio:${Math.round(w)} / ${h}"><img src="${esc(pvUrl(q.song))}" crossorigin="anonymous" alt="악보 한 줄"
            style="width:${(W / w * 100).toFixed(3)}%;margin-left:${(-x0 / w * 100).toFixed(3)}%;margin-top:${(-st.t / w * 100).toFixed(3)}%"></div>`;
    }).join('');
}
function showMore(q) {
    const st = q.an.staves, nx = st[q.an.pick + 1], pv = st[q.an.pick - 1], box = app.querySelector('.tabcrop');
    if (nx) box.insertAdjacentHTML('beforeend', strip(q, nx));
    else if (pv) box.insertAdjacentHTML('afterbegin', strip(q, pv));
}
function ask() {
    const q = G.qs[G.i];
    const L = 'ABCD';
    let body = '';
    if (G.mode === 'tab') {
        const canMore = q.an.staves.length > 1;
        body = `<div class="ask">${esc(q.ask)}</div><div class="tabcrop">${strip(q, q.an.staves[q.an.pick])}<span class="lbl">악보 by 안쌤</span></div>
            <div class="hints">${canMore ? `<button class="hint" id="more"><i class="fas fa-plus"></i> 한 줄 더 보기 <small>−${HINT_COST}점</small></button>` : ''}
            <button class="hint" id="hint"><i class="fas fa-user"></i> 가수 힌트 <small>−${HINT_COST}점</small></button></div>`;
    } else if (G.mode === 'artist') body = `<span class="chip">${esc(q.chip)}</span><div class="song">「${esc(q.title)}」</div><div class="ask" style="font-size:17px;color:#555;font-weight:700">누구 노래일까?</div>`;
    else body = `<div class="ask">${esc(q.ask)}</div>`;
    app.innerHTML = `<div class="qhd"><span class="md"><i class="fas ${G.m.icon}"></i> ${esc(G.m.name)}${G.lv ? ` <span class="lvtag" style="--c:${LV[G.lv].c}">${LV[G.lv].em} ${LV[G.lv].name}</span>` : ''}</span><span class="no">${G.i + 1} / ${G.qs.length}</span>
            <span class="sp"></span>${G.streak >= 2 ? `<span class="streak">🔥 ${G.streak}연속</span>` : ''}<span class="ok">맞힘 ${G.score}</span><span class="sc"><b>${G.pts.toLocaleString()}</b>점</span>
            <button class="snd" id="snd" aria-label="효과음 켜고 끄기" title="효과음 켜고 끄기"><i class="fas ${soundOn() ? 'fa-volume-high' : 'fa-volume-xmark'}"></i></button></div>
        <div class="timer" id="tm"><i></i></div>
        <div class="qbox card">${body}<div class="choices">${q.opts.map((o, k) => `<button data-o="${esc(o)}"><span class="k">${L[k]}</span>${esc(o)}</button>`).join('')}</div></div>
        <div id="fb"></div>`;
    app.querySelectorAll('.choices button').forEach(b => b.addEventListener('click', () => answer(b.dataset.o)));
    document.getElementById('snd').addEventListener('click', e => {
        mem.set('quiz.sound', !soundOn());
        e.currentTarget.innerHTML = `<i class="fas ${soundOn() ? 'fa-volume-high' : 'fa-volume-xmark'}"></i>`;
        if (soundOn()) fxSound(true);
    });
    q.hints = 0;
    if (G.mode === 'tab') {
        const more = document.getElementById('more'), hint = document.getElementById('hint');
        if (more) more.addEventListener('click', () => { if (q.done || q.more) return; q.more = true; q.hints++; more.disabled = true; more.innerHTML = '<i class="fas fa-check"></i> 한 줄 더 봤어요'; showMore(q); });
        hint.addEventListener('click', () => { if (q.done || q.art) return; q.art = true; q.hints++; hint.disabled = true; hint.innerHTML = `<i class="fas fa-user"></i> ${esc(q.hint || '정보 없음')}`; });
    }
    // 제한 시간
    const bar = app.querySelector('#tm i'), t0 = performance.now(), T = G.m.sec * 1000;
    q.left = 1;
    cancelAnimationFrame(timer);
    const tick = now => {
        const left = Math.max(0, 1 - (now - t0) / T);
        q.left = left;
        bar.style.transform = `scaleX(${left})`;
        app.querySelector('#tm').classList.toggle('warn', left < 0.3);
        if (left <= 0) return answer(null);
        timer = requestAnimationFrame(tick);
    };
    timer = requestAnimationFrame(tick);
    scrollTo(0, 0);
}
function answer(o) {
    const q = G.qs[G.i];
    if (!q || q.done) return;
    q.done = true;
    cancelAnimationFrame(timer);
    const ok = o === q.a;
    const got = ok ? points(q.left, q.hints) : 0;
    if (ok) { G.score++; G.streak++; G.pts += got; } else G.streak = 0;
    G.log.push({ q, o, ok, got });
    app.querySelectorAll('.choices button').forEach(b => {
        b.disabled = true;
        if (b.dataset.o === q.a) b.classList.add('ok');
        else if (b.dataset.o === o) b.classList.add('no');
    });
    app.querySelectorAll('.hint').forEach(h => { h.disabled = true; });
    if (G.mode === 'tab') {                      // 정답 공개: 첫 칸을 같은 높이 그대로 그림 맨 위(전체 폭)로 바꿔 악보 제목·가수가 보이게
        const img = app.querySelector('.tabcrop .strip img');
        if (img) Object.assign(img.style, { width: '100%', marginLeft: '0%', marginTop: '0%' });
        const lbl = app.querySelector('.tabcrop .lbl');
        if (lbl) lbl.remove();
    }
    const sc = app.querySelector('.qhd');
    sc.querySelector('.ok').textContent = `맞힘 ${G.score}`;
    sc.querySelector('.sc b').textContent = G.pts.toLocaleString();
    const s = q.song;
    let x = q.x ? esc(q.x) : '';
    if (s) x = `${G.mode === 'artist' ? `「${esc(q.title)}」 — ${esc(q.a)}` : `${esc(q.a)} — ${esc(nfc(s.artist))}`}${G.mode === 'tab' || s.on_sale ? ` · <a href="../tab-detail.html?id=${encodeURIComponent(s.id)}" target="_blank" rel="noopener">이 곡 악보 보기</a>` : ''}`;
    const cov = s && cvUrl(s);
    const last = G.i === G.qs.length - 1;
    document.getElementById('fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}">${cov ? `<img class="cover" src="${esc(cov)}" alt="">` : ''}
        <span class="t">${ok ? `⭕ 정답!<em>+${got}점</em>` : o === null ? '⏰ 시간 끝!' : '❌ 땡!'}</span><span class="x">${x}</span>
        <button class="btn" id="next">${last ? '결과 보기' : '다음 문제'} <i class="fas fa-arrow-right"></i></button></div>`;
    document.getElementById('next').addEventListener('click', next);
    document.getElementById('next').focus({ preventScroll: true });
    fxShow(ok, o, got);
}

// ---------- 정답·오답 연출 ----------
// 연습도구 '코드 진행 청음'과 같은 느낌 (2026-11-08 사용자 요청):
//   정답 — 팡! 튀어오르며 초록 빛 + 큰 ⭕ 도장 + "띠-링" / 오답 — 부들부들 흔들리고 축 처짐 + 큰 ❌ 도장 + "뿌-뿌-뿌-뿌우~"
const soundOn = () => mem.get('quiz.sound', true);
let actx = null;
function fxTone(freq, start, dur, type, vol, freqEnd) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, start);
    if (freqEnd) o.frequency.linearRampToValueAtTime(freqEnd, start + dur);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g);
    return { o, g };
}
function fxSound(ok) {
    if (!soundOn()) return;
    try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
        const t = actx.currentTime + 0.02, out = actx.createGain();
        out.gain.value = 0.5;
        out.connect(actx.destination);
        if (ok) {            // 띠-링! — 밝게 올라가는 3음 + 반짝이
            [[1318.5, 0], [1568, 0.07], [2093, 0.14]].forEach(([f, d]) => {
                const v = fxTone(f, t + d, 0.45, 'triangle', 0.32);
                v.g.connect(out); v.o.start(t + d); v.o.stop(t + d + 0.5);
            });
            const sp = fxTone(4186, t + 0.2, 0.35, 'sine', 0.08);
            sp.g.connect(out); sp.o.start(t + 0.2); sp.o.stop(t + 0.6);
        } else {             // 뿌-뿌-뿌-뿌우~ — 축 처지는 트롬본
            const lp = actx.createBiquadFilter();
            lp.type = 'lowpass'; lp.frequency.value = 1100; lp.connect(out);
            const notes = [[392, 0, 0.26], [370, 0.3, 0.26], [349, 0.6, 0.26], [330, 0.9, 0.95]];
            notes.forEach(([f, d, len], i) => {
                const last = i === notes.length - 1;
                const v = fxTone(f, t + d, len, 'sawtooth', 0.22, last ? f * 0.94 : null);
                if (last) {
                    const lfo = actx.createOscillator(), lg = actx.createGain();
                    lfo.frequency.value = 6; lg.gain.value = 7;
                    lfo.connect(lg); lg.connect(v.o.frequency);
                    lfo.start(t + d); lfo.stop(t + d + len);
                }
                v.g.connect(lp); v.o.start(t + d); v.o.stop(t + d + len + 0.05);
            });
        }
    } catch (e) {}
}
function replay(el, cls) {
    if (!el) return;
    el.classList.remove('fx-hit', 'fx-miss', 'fx-reveal');
    void el.offsetWidth;   // 애니메이션 다시 시작
    el.classList.add(cls);
}
function fxShow(ok, o, got) {
    const box = app.querySelector('.qbox');
    const btns = [...app.querySelectorAll('.choices button')];
    const mine = o == null ? null : btns.find(b => b.dataset.o === o);
    replay(mine, ok ? 'fx-hit' : 'fx-miss');
    if (!ok) replay(btns.find(b => b.dataset.o === G.qs[G.i].a), 'fx-reveal');   // 정답 칸은 초록 테두리로 깜빡여 알려 주기
    replay(document.querySelector('#fb .fb'), ok ? 'fx-hit' : 'fx-miss');
    if (ok && mine) mine.insertAdjacentHTML('beforeend', `<span class="plus">+${got}</span>`);
    if (box) {
        box.querySelector('.stamp')?.remove();
        box.insertAdjacentHTML('beforeend', `<span class="stamp ${ok ? 'o' : 'x'}" aria-hidden="true"></span>`);
        const st = box.querySelector('.stamp');
        setTimeout(() => st.remove(), 1400);
    }
    fxSound(ok);
}
function next() {
    G.i++;
    if (G.i < G.qs.length) return ask();
    interstitial(result);
}

// ---------- 결과 ----------
function result() {
    const [, rank, cm] = RANK.find(([min]) => G.score * (10 / G.qs.length) >= min);
    const songs = G.log.map(l => l.q.song).filter(s => s && (G.mode === 'tab' || s.on_sale));
    app.innerHTML = `<section class="res">
        <div class="md"><i class="fas ${G.m.icon}"></i> ${esc(modeName(G))}</div>
        <div class="score">${G.score}<small> / ${G.qs.length}</small></div>
        <div class="pts">${G.pts.toLocaleString()}점</div>
        <div class="rank">${rank}</div><div class="cm">${esc(cm)}</div>
        <div class="board" id="board"></div>
        <div class="btns"><button class="btn" id="again"><i class="fas fa-rotate-right"></i>다시 하기</button>
            ${G.lv ? `<button class="btn ghost" id="lvb"><i class="fas fa-signal"></i>다른 난이도</button>` : ''}
            <button class="btn ghost" id="other"><i class="fas fa-shuffle"></i>다른 퀴즈</button>
            <button class="btn ghost" id="share"><i class="fas fa-share-nodes"></i>점수 자랑하기</button></div>
        ${adSlot('r300')}
        <div class="review card"><h3>문제 다시 보기</h3><ul>${G.log.map((l, k) => `<li><i class="fas ${l.ok ? 'fa-circle-check' : 'fa-circle-xmark'}"></i><span>
            <b>${k + 1}. ${esc(G.mode === 'artist' ? `「${l.q.title}」 누구 노래?` : G.mode === 'tab' ? `악보 보고 맞히기 — ${l.q.a}` : l.q.ask)}</b>
            <small>${G.mode === 'tab' ? '' : `정답: ${esc(l.q.a)}`}${!l.ok ? `${G.mode === 'tab' ? '' : ' · '}내 답: ${esc(l.o ?? '시간 끝')}` : `${G.mode === 'tab' ? '' : ' · '}+${l.got}점`}${l.q.hints ? ` · 힌트 ${l.q.hints}개` : ''}</small></span></li>`).join('')}</ul></div>
        <div class="rec">${songs.length ? `<h3><i class="fas fa-music" style="color:var(--green-mid)"></i>이번 퀴즈에 나온 곡 악보 <small>안쌤 TAB악보</small></h3><div class="list">${songs.map(recRow).join('')}</div>`
            : `<h3><i class="fas fa-book" style="color:var(--green-mid)"></i>기초부터 탄탄하게</h3><div class="list"><a href="../#books"><span class="cv"><i class="fas fa-book"></i></span><span class="mt"><b>안쌤 기타 교본</b><small>코드·리듬·주법을 차근차근</small></span></a><a href="../tools.html"><span class="cv"><i class="fas fa-sliders"></i></span><span class="mt"><b>무료 연습도구</b><small>튜너 · 메트로놈 · 지판</small></span></a></div>`}</div>
    </section>`;
    scrollTo(0, 0);
    const g = G;
    document.getElementById('again').onclick = () => begin(g.mode, g.lv);
    document.getElementById('other').onclick = start;
    if (g.lv) document.getElementById('lvb').onclick = pickLevel;
    document.getElementById('share').onclick = () => share('안쌤의 기타 퀴즈쇼', `${modeName(g)} ${g.score}/${g.qs.length} (${g.pts.toLocaleString()}점) — ${rank.replace(/^\S+\s/, '')} 🎸 너는 몇 점?`);
    // 다른 사람들과 비교 (db/play_stats.sql 적용 뒤부터 보임)
    if (!g.saved) {
        g.saved = true;
        rpc('play_quiz_save', { p_mode: g.lv ? `${g.mode}${g.lv}` : g.mode, p_correct: g.score, p_total: g.qs.length, p_score: g.pts }).then(r => {
            const x = Array.isArray(r) ? r[0] : r;
            if (!x || !x.plays) return;
            const pct = Math.max(1, Math.ceil(x.rank / x.plays * 100));
            const el = document.getElementById('board');
            if (el && G === g) el.innerHTML = `📊 지금까지 ${x.plays.toLocaleString()}판 중 <b>${x.rank.toLocaleString()}등</b> · 상위 <b>${pct}%</b>`;
        }).catch(() => {});
    }
}

addEventListener('keydown', e => {
    if (!G || !app.querySelector('.choices') || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = 'abcd1234'.indexOf(e.key.toLowerCase());
    if (k >= 0 && !G.qs[G.i].done) { const b = app.querySelectorAll('.choices button')[k % 4]; if (b) b.click(); }
});

const P = new URLSearchParams(location.search);
if (P.get('m') === 'trivia' && !LV[P.get('lv')]) pickLevel();   // 상식은 난이도부터 (순위도 난이도마다 따로: trivia1·2·3)
else if (MODES[P.get('m')]) begin(P.get('m'), +P.get('lv') || 0); else start();
</script>
