const nfc = s => String(s || '').normalize('NFC').trim();
const key = s => nfc(s).toLowerCase().replace(/[\s.,'’!?&()-]/g, '');
// 보기에 쓰는 곡 이름: "(2025 편곡)", "(안쌤ver)", "쉽게", "매운맛 …" 같은 판 표시와
// 끝에 붙은 설명 괄호("(귀멸의 칼날 OST)", "(봇치 더 락!)")는 뺀다 — 답이 보기에 드러나지 않게. "(Itte)" 같은 원제는 둔다
const qTitle = t => baseTitle(nfc(t)).replace(/\s*\(안쌤\s*ver\.?\)\s*/i, ' ').replace(/\s+(매운맛|순한맛).*$/, '').replace(/\s+쉽게$/, '').trim()
    .replace(/\s*\(([^)]*)\)$/, (m, x) => (/[^\x00-\x7f]|OST|vs/i.test(x) ? '' : m)).trim();
// 악보 보고 맞히기에서 뺄 곡: 곡이 아니라 연습용 진행
const NOT_SONG = /^neo soul progression$/i;

// 최근에 낸 문제는 뒤로 미룬다 (이 브라우저에서 최근 30개)
function fresh(list, id, mode) {
    const seen = new Set(mem.get('quiz.seen.' + mode, []));
    return [...list.filter(x => !seen.has(id(x))), ...list.filter(x => seen.has(id(x)))];
}
function remember(mode, ids) {
    const old = mem.get('quiz.seen.' + mode, []).filter(x => !ids.includes(x));
    mem.set('quiz.seen.' + mode, [...old, ...ids].slice(-30));
}

// 미리보기 그림에서 TAB 줄(보표) 찾기 — 연한 회색 가로줄 6개(베이스는 4개)가 모이면 한 줄.
// 줄 아래 음표 기둥 수와 줄 안 숫자 잉크를 세서, 쉼표만 있는 줄(인트로 쉼 등)은 건너뛴다.
function analyze(img) {
    const W = img.naturalWidth, H = img.naturalHeight;
    if (!W || !H) return null;
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const cx = cv.getContext('2d', { willReadFrequently: true });
    cx.fillStyle = '#fff'; cx.fillRect(0, 0, W, H); cx.drawImage(img, 0, 0);
    const px = cx.getImageData(0, 0, W, H).data, g = new Uint8Array(W * H);
    for (let i = 0, j = 0; i < g.length; i++, j += 4) g[i] = (px[j] + px[j + 1] + px[j + 2]) / 3;
    const x0 = 30, x1 = W - 30, span = x1 - x0;
    const ys = [];
    for (let y = 0; y < H; y++) {
        let l = 0, b = 0;
        for (let o = y * W + x0, e = y * W + x1; o < e; o++) { const v = g[o]; if (v < 235) l++; if (v < 120) b++; }
        if (l > span * 0.6 && b < span * 0.3) ys.push(y);   // 회색 보표 줄(검은 빔은 빼기)
    }
    const lines = [];
    ys.forEach(y => { const L = lines[lines.length - 1]; if (L && y - L.b <= 2) L.b = y; else lines.push({ a: y, b: y }); });
    let groups = [];
    lines.map(L => (L.a + L.b) / 2).forEach(y => { const G = groups[groups.length - 1]; if (G && y - G[G.length - 1] <= 18) G.push(y); else groups.push([y]); });
    groups = groups.filter(G => G.length >= 4);
    if (!groups.length) return null;
    const cnt = {}; groups.forEach(G => { cnt[G.length] = (cnt[G.length] || 0) + 1; });
    const n = Math.min(6, +Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a] || b - a)[0]);
    const staves = [];
    groups.forEach(G => {
        if (G.length < n) return;                 // 아래가 잘린 줄
        let best = 0, bestSpread = Infinity;       // 줄이 더 잡혔으면(괄호선 등) 간격이 가장 고른 n개
        for (let i = 0; i + n <= G.length; i++) {
            const gaps = G.slice(i + 1, i + n).map((y, k) => y - G[i + k]);
            const spread = Math.max(...gaps) - Math.min(...gaps);
            if (spread < bestSpread) { bestSpread = spread; best = i; }
        }
        staves.push({ top: Math.round(G[best]), bot: Math.round(G[best + n - 1]) });
    });
    if (!staves.length) return null;
    const xa = 80, xb = W - 20;
    staves.forEach(s => {
        let stems = 0, prev = false;               // 줄 바로 아래 음표 기둥 수
        for (let x = xa; x < xb; x++) {
            let d = false;
            for (let y = s.bot + 4; y < Math.min(H, s.bot + 12) && !d; y++) d = g[y * W + x] < 170;
            if (d && !prev) stems++;
            prev = d;
        }
        let ink = 0;                               // 줄 안 숫자(마디줄 빼고)가 차지한 칸 수
        const ya = Math.max(0, s.top - 3), yb = Math.min(H, s.bot + 4), hh = yb - ya;
        for (let x = xa; x < xb; x++) {
            let c = 0;
            for (let y = ya; y < yb; y++) if (g[y * W + x] < 120) c++;
            if (c && c < hh * 0.8) ink++;
        }
        s.stems = stems; s.ink = ink;
    });
    // 아래 끝: 음표 기둥·빔이 끝나고 빈 줄이 두 번 나오는 곳 — 그 아래 가사가 있어도(답이 보이니) 자른다
    const empty = y => { for (let o = y * W + xa, e = y * W + xb; o < e; o++) if (g[o] < 150) return false; return true; };
    staves.forEach(s => {
        let y = s.bot + 8;
        while (y < Math.min(H - 1, s.bot + 46) && !(empty(y) && empty(y + 1))) y++;
        s.end = y + 2;
    });
    staves.forEach((s, i) => {
        const p = staves[i - 1], q = staves[i + 1];
        s.t = Math.max(s.top - 58, p ? p.bot + 46 : 102);   // 위: 코드 이름·구간 표시까지 (맨 위 줄은 제목·가수 아래부터)
        s.b = Math.min(s.end, s.bot + 46, q ? q.top - 30 : H);
    });
    let pick = staves.findIndex(s => s.stems >= 8 && s.ink >= 100);
    if (pick < 0) pick = staves.reduce((m, s, i) => (s.stems * 10 + s.ink > staves[m].stems * 10 + staves[m].ink ? i : m), 0);
    return { W, H, staves, pick };
}
function loadSheet(s) {
    return new Promise((res, rej) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => { try { const a = analyze(img); a ? res({ s, a }) : rej(new Error('no staff')); } catch (e) { rej(e); } };
        img.onerror = () => rej(new Error('load'));
        img.src = pvUrl(s);
    });
}

async function build(mode) {
    if (mode === 'trivia') {
        const list = fresh(shuffle(TRIVIA), t => t.q, mode).slice(0, N);
        return list.map(t => ({ id: t.q, ask: t.q, a: t.a, opts: shuffle([t.a, ...t.w]), x: t.x }));
    }
    if (mode === 'tab') {
        // 같은 곡은 하나만 — 반주·핑거 악보를 먼저(솔로·베이스는 곡 처음이 아니라 알아보기 어려움). 코드악보·자작곡은 뺌
        const rows = (await previews()).filter(s => s.kind !== 'original' && s.style !== 'chord' && !NOT_SONG.test(nfc(s.title)));
        const pref = s => ({ electric: 0, fingerstyle: 0, acoustic: 1, solo: 2, bass: 3 }[s.style] ?? 4);
        const uniq = new Map();
        shuffle(rows).sort((a, b) => pref(a) - pref(b)).forEach(s => { const k = key(qTitle(s.title)); if (k && !uniq.has(k)) uniq.set(k, s); });
        const songs = [...uniq.values()];
        const order = fresh(shuffle(songs), s => key(qTitle(s.title)), mode);
        const got = [];
        for (let i = 0; i < order.length && got.length < N; ) {      // 그림을 읽어 보표를 못 찾으면 다음 곡
            const part = order.slice(i, i + (N - got.length) + 2);
            i += part.length;
            (await Promise.all(part.map(s => loadSheet(s).catch(() => null)))).forEach(x => { if (x && got.length < N) got.push(x); });
        }
        const grp = s => (s.style === 'fingerstyle' ? 'f' : 'b');      // 오답은 같은 느낌(핑거 ↔ 밴드) 곡에서 먼저
        return got.map(({ s, a: an }) => {
            const a = qTitle(s.title);
            const near = shuffle(songs.filter(o => o !== s && grp(o) === grp(s))), far = shuffle(songs.filter(o => o !== s && grp(o) !== grp(s)));
            const others = [...near, ...far].map(o => qTitle(o.title)).slice(0, 3);
            return { id: key(a), ask: '이 악보, 무슨 곡일까?', a, opts: shuffle([a, ...others]), song: s, an, hint: nfc(s.artist) };
        });
    }
    // artist: 가수 칸에 괄호(OST·원곡 설명)가 없고 진짜 가수·연주자인 곡만 — 'OO OST', '안쌤의 기타나무숲', 영화사 이름은 빼서 정답이 헷갈리지 않게
    const rows = (await catalog()).filter(s => s.artist && !/[()]/.test(s.artist) && !/OST|안쌤|기타나무숲|폭스|fox/i.test(s.artist) && s.kind !== 'original'
        && !key(s.title).includes(key(s.artist)));      // "뽀로로 - 노는게 제일 좋아"처럼 제목에 답이 든 곡은 빼기
    const uniq = new Map();
    shuffle(rows).forEach(r => { const k = key(qTitle(r.title)); if (k && !uniq.has(k)) uniq.set(k, r); });
    const songs = fresh([...uniq.values()], s => key(qTitle(s.title)), mode);
    const artists = [...new Map(rows.map(r => [key(r.artist), { name: nfc(r.artist), genre: r.genre }])).values()];
    return songs.slice(0, N).map(s => {
        const a = nfc(s.artist);
        const same = shuffle(artists.filter(x => x.genre === s.genre && key(x.name) !== key(a)));
        const any = shuffle(artists.filter(x => key(x.name) !== key(a) && !same.includes(x)));
        const others = [...same, ...any].slice(0, 3).map(x => x.name);
        return { id: key(qTitle(s.title)), ask: '', title: qTitle(s.title), chip: `${s.genre || ''}${s.genre ? ' · ' : ''}${STYLE[s.style] || ''} 악보`, a, opts: shuffle([a, ...others]), song: s };
    });
}

// ---------- 진행 ----------
let G = null, timer = null;
async function begin(mode) {
    history.replaceState(null, '', `?m=${mode}`);
    G = null;
    app.innerHTML = `<p style="text-align:center;padding:60px 0;color:#888"><i class="fas fa-spinner fa-spin"></i> 문제를 고르는 중…</p>`;
    let qs;
    try { qs = await build(mode); if (qs.length < 4) throw new Error('few'); }
    catch (e) { app.innerHTML = `<p style="text-align:center;padding:60px 0">문제를 불러오지 못했어요. <a href="" style="text-decoration:underline">다시 시도</a></p>`; return; }
    remember(mode, qs.map(q => q.id));
    G = { mode, m: MODES[mode], qs, i: 0, score: 0, pts: 0, streak: 0, log: [] };
    ask();
}
// 악보 자르기: 그림에서 [t, b] 구간만 같은 비율로 (그림 폭 = 상자 폭). 한 줄 더 보면 다음 줄(없으면 앞 줄)을 따로 붙인다
// 휴대폰(좁은 화면)에서는 한 줄을 왼쪽·오른쪽 반으로 나눠 위아래로 — 숫자가 두 배 크게 보이게
const NARROW = () => matchMedia('(max-width: 640px)').matches;
function strip(q, st) {
    const W = q.an.W, h = Math.max(30, st.b - st.t);
    return (NARROW() ? [[0, 0.53], [0.47, 1]] : [[0, 1]]).map(([a, b]) => {
        const x0 = a * W, w = (b - a) * W;
        return `<div class="strip" style="aspect-ratio:${Math.round(w)} / ${h}"><img src="${esc(pvUrl(q.song))}" crossorigin="anonymous" alt="악보 한 줄"
            style="width:${(W / w * 100).toFixed(3)}%;margin-left:${(-x0 / w * 100).toFixed(3)}%;margin-top:${(-st.t / w * 100).toFixed(3)}%"></div>`;
    }).join('');
}
function showMore(q) {
    const st = q.an.staves, nx = st[q.an.pick + 1], pv = st[q.an.pick - 1], box = app.querySelector('.tabcrop');
    if (nx) box.insertAdjacentHTML('beforeend', strip(q, nx));
    else if (pv) box.insertAdjacentHTML('afterbegin', strip(q, pv));
}
function ask() {
    const q = G.qs[G.i];
    const L = 'ABCD';
    let body = '';
    if (G.mode === 'tab') {
        const canMore = q.an.staves.length > 1;
        body = `<div class="ask">${esc(q.ask)}</div><div class="tabcrop">${strip(q, q.an.staves[q.an.pick])}<span class="lbl">악보 by 안쌤</span></div>
            <div class="hints">${canMore ? `<button class="hint" id="more"><i class="fas fa-plus"></i> 한 줄 더 보기 <small>−${HINT_COST}점</small></button>` : ''}
            <button class="hint" id="hint"><i class="fas fa-user"></i> 가수 힌트 <small>−${HINT_COST}점</small></button></div>`;
    } else if (G.mode === 'artist') body = `<span class="chip">${esc(q.chip)}</span><div class="song">「${esc(q.title)}」</div><div class="ask" style="font-size:17px;color:#555;font-weight:700">누구 노래일까?</div>`;
    else body = `<div class="ask">${esc(q.ask)}</div>`;
    app.innerHTML = `<div class="qhd"><span class="md"><i class="fas ${G.m.icon}"></i> ${esc(G.m.name)}</span><span class="no">${G.i + 1} / ${G.qs.length}</span>
            <span class="sp"></span>${G.streak >= 2 ? `<span class="streak">🔥 ${G.streak}연속</span>` : ''}<span class="ok">맞힘 ${G.score}</span><span class="sc"><b>${G.pts.toLocaleString()}</b>점</span></div>
        <div class="timer" id="tm"><i></i></div>
        <div class="qbox card">${body}<div class="choices">${q.opts.map((o, k) => `<button data-o="${esc(o)}"><span class="k">${L[k]}</span>${esc(o)}</button>`).join('')}</div></div>
        <div id="fb"></div>`;
    app.querySelectorAll('.choices button').forEach(b => b.addEventListener('click', () => answer(b.dataset.o)));
    q.hints = 0;
    if (G.mode === 'tab') {
        const more = document.getElementById('more'), hint = document.getElementById('hint');
        if (more) more.addEventListener('click', () => { if (q.done || q.more) return; q.more = true; q.hints++; more.disabled = true; more.innerHTML = '<i class="fas fa-check"></i> 한 줄 더 봤어요'; showMore(q); });
        hint.addEventListener('click', () => { if (q.done || q.art) return; q.art = true; q.hints++; hint.disabled = true; hint.innerHTML = `<i class="fas fa-user"></i> ${esc(q.hint || '정보 없음')}`; });
    }
    // 제한 시간
    const bar = app.querySelector('#tm i'), t0 = performance.now(), T = G.m.sec * 1000;
    q.left = 1;
    cancelAnimationFrame(timer);
    const tick = now => {
        const left = Math.max(0, 1 - (now - t0) / T);
        q.left = left;
        bar.style.transform = `scaleX(${left})`;
        app.querySelector('#tm').classList.toggle('warn', left < 0.3);
        if (left <= 0) return answer(null);
        timer = requestAnimationFrame(tick);
    };
    timer = requestAnimationFrame(tick);
    scrollTo(0, 0);
}
function answer(o) {
    const q = G.qs[G.i];
    if (!q || q.done) return;
    q.done = true;
    cancelAnimationFrame(timer);
    const ok = o === q.a;
    const got = ok ? points(q.left, q.hints) : 0;
    if (ok) { G.score++; G.streak++; G.pts += got; } else G.streak = 0;
    G.log.push({ q, o, ok, got });
    app.querySelectorAll('.choices button').forEach(b => {
        b.disabled = true;
        if (b.dataset.o === q.a) b.classList.add('ok');
        else if (b.dataset.o === o) b.classList.add('no');
    });
    app.querySelectorAll('.hint').forEach(h => { h.disabled = true; });
    if (G.mode === 'tab') {                      // 정답 공개: 첫 칸을 같은 높이 그대로 그림 맨 위(전체 폭)로 바꿔 악보 제목·가수가 보이게
        const img = app.querySelector('.tabcrop .strip img');
        if (img) Object.assign(img.style, { width: '100%', marginLeft: '0%', marginTop: '0%' });
        const lbl = app.querySelector('.tabcrop .lbl');
        if (lbl) lbl.remove();
    }
    const sc = app.querySelector('.qhd');
    sc.querySelector('.ok').textContent = `맞힘 ${G.score}`;
    sc.querySelector('.sc b').textContent = G.pts.toLocaleString();
    const s = q.song;
    let x = q.x ? esc(q.x) : '';
    if (s) x = `${G.mode === 'artist' ? `「${esc(q.title)}」 — ${esc(q.a)}` : `${esc(q.a)} — ${esc(nfc(s.artist))}`}${G.mode === 'tab' || s.on_sale ? ` · <a href="../tab-detail.html?id=${encodeURIComponent(s.id)}" target="_blank" rel="noopener">이 곡 악보 보기</a>` : ''}`;
    const cov = s && cvUrl(s);
    const last = G.i === G.qs.length - 1;
    document.getElementById('fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}">${cov ? `<img class="cover" src="${esc(cov)}" alt="">` : ''}
        <span class="t">${ok ? `⭕ 정답!<em>+${got}점</em>` : o === null ? '⏰ 시간 끝!' : '❌ 땡!'}</span><span class="x">${x}</span>
        <button class="btn" id="next">${last ? '결과 보기' : '다음 문제'} <i class="fas fa-arrow-right"></i></button></div>`;
    document.getElementById('next').addEventListener('click', next);
    document.getElementById('next').focus({ preventScroll: true });
}
function next() {
    G.i++;
    if (G.i < G.qs.length) return ask();
    interstitial(result);
}

// ---------- 결과 ----------
function result() {
    const [, rank, cm] = RANK.find(([min]) => G.score * (10 / G.qs.length) >= min);
    const songs = G.log.map(l => l.q.song).filter(s => s && (G.mode === 'tab' || s.on_sale));
    app.innerHTML = `<section class="res">
        <div class="md"><i class="fas ${G.m.icon}"></i> ${esc(G.m.name)}</div>
        <div class="score">${G.score}<small> / ${G.qs.length}</small></div>
        <div class="pts">${G.pts.toLocaleString()}점</div>
        <div class="rank">${rank}</div><div class="cm">${esc(cm)}</div>
        <div class="board" id="board"></div>
        <div class="btns"><button class="btn" id="again"><i class="fas fa-rotate-right"></i>다시 하기</button>
            <button class="btn ghost" id="other"><i class="fas fa-shuffle"></i>다른 퀴즈</button>
            <button class="btn ghost" id="share"><i class="fas fa-share-nodes"></i>점수 자랑하기</button></div>
        ${adSlot('r300')}
        <div class="review card"><h3>문제 다시 보기</h3><ul>${G.log.map((l, k) => `<li><i class="fas ${l.ok ? 'fa-circle-check' : 'fa-circle-xmark'}"></i><span>
            <b>${k + 1}. ${esc(G.mode === 'artist' ? `「${l.q.title}」 누구 노래?` : G.mode === 'tab' ? `악보 보고 맞히기 — ${l.q.a}` : l.q.ask)}</b>
            <small>${G.mode === 'tab' ? '' : `정답: ${esc(l.q.a)}`}${!l.ok ? `${G.mode === 'tab' ? '' : ' · '}내 답: ${esc(l.o ?? '시간 끝')}` : `${G.mode === 'tab' ? '' : ' · '}+${l.got}점`}${l.q.hints ? ` · 힌트 ${l.q.hints}개` : ''}</small></span></li>`).join('')}</ul></div>
        <div class="rec">${songs.length ? `<h3><i class="fas fa-music" style="color:var(--green-mid)"></i>이번 퀴즈에 나온 곡 악보 <small>안쌤 TAB악보</small></h3><div class="list">${songs.map(recRow).join('')}</div>`
            : `<h3><i class="fas fa-book" style="color:var(--green-mid)"></i>기초부터 탄탄하게</h3><div class="list"><a href="../#books"><span class="cv"><i class="fas fa-book"></i></span><span class="mt"><b>안쌤 기타 교본</b><small>코드·리듬·주법을 차근차근</small></span></a><a href="../tools.html"><span class="cv"><i class="fas fa-sliders"></i></span><span class="mt"><b>무료 연습도구</b><small>튜너 · 메트로놈 · 지판</small></span></a></div>`}</div>
    </section>`;
    scrollTo(0, 0);
    const g = G;
    document.getElementById('again').onclick = () => begin(g.mode);
    document.getElementById('other').onclick = start;
    document.getElementById('share').onclick = () => share('안쌤의 기타 퀴즈쇼', `${g.m.name} ${g.score}/${g.qs.length} (${g.pts.toLocaleString()}점) — ${rank.replace(/^\S+\s/, '')} 🎸 너는 몇 점?`);
    // 다른 사람들과 비교 (db/play_stats.sql 적용 뒤부터 보임)
    if (!g.saved) {
        g.saved = true;
        rpc('play_quiz_save', { p_mode: g.mode, p_correct: g.score, p_total: g.qs.length, p_score: g.pts }).then(r => {
            const x = Array.isArray(r) ? r[0] : r;
            if (!x || !x.plays) return;
            const pct = Math.max(1, Math.ceil(x.rank / x.plays * 100));
            const el = document.getElementById('board');
            if (el && G === g) el.innerHTML = `📊 지금까지 ${x.plays.toLocaleString()}판 중 <b>${x.rank.toLocaleString()}등</b> · 상위 <b>${pct}%</b>`;
        }).catch(() => {});
    }
}

addEventListener('keydown', e => {
    if (!G || !app.querySelector('.choices') || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = 'abcd1234'.indexOf(e.key.toLowerCase());
    if (k >= 0 && !G.qs[G.i].done) { const b = app.querySelectorAll('.choices button')[k % 4]; if (b) b.click(); }
});

const P = new URLSearchParams(location.search);
if (MODES[P.get('m')]) begin(P.get('m')); else start();
</script>
