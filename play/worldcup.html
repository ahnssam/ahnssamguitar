    /* 시작: 주제 고르기 */

    .theme .peek { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }

    .theme p { color: #555; font-size: 13.5px; }
    .theme .btns { justify-content: flex-start; }
    .theme .btn { padding: 10px 16px; font-size: 14px; }
    .theme.soon { opacity: 0.75; }
    .theme.soon .peek i { background: repeating-linear-gradient(-45deg, #f1f4f2 0 8px, #eaeeeb 8px 16px); display: grid; place-items: center; font-style: normal; color: #b7c0bb; font-size: 22px; }
    .soonlist { display: flex; flex-wrap: wrap; gap: 6px; }
    .soonlist span { font-size: 12.5px; padding: 4px 10px; border-radius: 999px; background: #f1f4f2; color: #666; }

    /* 대결 */
    .round { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 18px 0 4px; flex-wrap: wrap; }

    .round .bar i { display: block; height: 100%; background: var(--green-mid); transition: width .3s; }
    .round .undo { font-size: 13px; color: #666; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; }
    .round .undo[disabled] { opacity: .4; cursor: default; }
    .q { text-align: center; color: var(--sub); font-size: 13.5px; margin-bottom: 12px; }
    .vs { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .vs .mark { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); z-index: 2; width: 56px; height: 56px; border-radius: 50%; background: var(--ink); color: #fff; font-weight: 900; font-size: 18px; display: grid; place-items: center; box-shadow: 0 0 0 5px var(--cream); font-family: 'Arial Black', sans-serif; pointer-events: none; }
    .pick { text-align: left; padding: 10px; transition: transform .25s, opacity .25s, box-shadow .25s; display: flex; flex-direction: column; }
    .pick:hover { transform: translateY(-3px); box-shadow: 0 2px 0 var(--green-pale), 0 14px 34px rgba(42, 107, 74, 0.16); }
    .pick .ph-img { height: min(54vh, 470px); border-radius: 12px; background: #f1f4f2; display: block; overflow: hidden; }
    .pick .ph-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .pick .nm { padding: 10px 4px 2px; }
    .pick .nm b { display: block; font-size: 17px; font-weight: 900; line-height: 1.3; }
    .pick .nm small { display: block; color: var(--sub); font-size: 12.5px; }
    .pick .nm span { display: block; color: #444; font-size: 13px; margin-top: 4px; }
    .pick.won { transform: scale(1.03); box-shadow: 0 0 0 3px var(--green-mid), 0 14px 34px rgba(42, 107, 74, 0.2); }
    .pick.lost { opacity: .25; transform: scale(.96); }
    .keys { text-align: center; color: #aaa; font-size: 12px; margin-top: 10px; }
    @media (max-width: 640px) {
        .vs { gap: 8px; }
        .pick { padding: 6px; }
        .pick .ph-img { height: 46vh; }
        .pick .nm b { font-size: 14.5px; }
        .pick .nm span { display: none; }
        .vs .mark { width: 42px; height: 42px; font-size: 14px; }
        .keys { display: none; }
    }

    /* 우승 */
    .win { text-align: center; padding: 26px 0 0; }
    .win .crown { font-size: 13px; font-weight: 900; letter-spacing: .2em; color: var(--gold); }

    .podium small { display: block; font-size: 11.5px; color: var(--gold); font-weight: 700; }
    .podium b { font-size: 13px; }
    .win .btns { margin-top: 18px; }

    .rank { max-width: 640px; margin: 18px auto 0; padding: 14px 16px 8px; text-align: left; }

    .rank li { display: grid; grid-template-columns: 26px 36px minmax(0, 1fr) 120px 58px; align-items: center; gap: 8px; padding: 6px 4px; border-top: 1px solid var(--line); font-size: 13px; }
    .rank li.hd { font-size: 11.5px; color: var(--sub); border-top: 0; padding-bottom: 2px; }
    .rank li.me { background: var(--green-faint); border-radius: 8px; }
    .rank .no { font-weight: 900; color: var(--gold); text-align: center; }

    .rank img { width: 36px; height: 44px; object-fit: contain; background: #f1f4f2; border-radius: 6px; display: block; }
    .rank .nm { min-width: 0; }

    .rank .nm small { display: block; color: var(--sub); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rank .wr { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
    .rank .wr .bar { flex: 1; height: 8px; background: #e8eeea; border-radius: 99px; overflow: hidden; }
    .rank .wr .bar i { display: block; height: 100%; background: var(--green-mid); }
    .rank .mr { font-size: 12px; color: #555; text-align: right; }
    .rank .more { display: block; margin: 6px auto 4px; font-size: 13px; color: var(--green-deep); font-weight: 700; }

    .theme .rkline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: -2px; font-size: 12.5px; }
    .theme .lead { color: var(--green-deep); font-weight: 700; }

    .credits summary { cursor: pointer; }
    .credits ul { list-style: none; margin-top: 6px; columns: 2 260px; }
    .credits a { text-decoration: underline; }

// 다음에 만들 주제 (준비 중으로만 보임)
const SOON = ['입문 일렉 (100만원 아래)', '통기타 브랜드', '이펙터 페달', '기타 앰프', '전설의 기타리스트 기타'];

const { esc, shuffle, adSlot, interstitial, share, catalog, recRow, rpc } = PLAY;
const app = document.getElementById('app');
const imgSrc = it => `../images/play/wc/${it.k}.jpg`;
const roundName = n => n === 2 ? '결승' : n === 4 ? '4강' : `${n}강`;

// ---------- 시작 화면 ----------
function start() {
    history.replaceState(null, '', location.pathname);
    const card = (key, t) => `<div class="theme card">
        <div class="peek">${t.items.slice(0, 4).map(it => `<i style="background-image:url('${imgSrc(it)}')"></i>`).join('')}</div>
        <h2><i class="fas ${t.icon}" style="color:var(--green-mid)"></i>${esc(t.title)} <small>${t.tag}</small></h2>
        <p>${esc(t.desc)}</p>
        <div class="btns"><button class="btn" data-go="${key}" data-n="16"><i class="fas fa-play"></i>16강 시작</button><button class="btn ghost" data-go="${key}" data-n="8">8강 빠르게</button></div>
        <div class="rkline"><span class="lead" data-lead="${key}"></span><button class="rk-link" data-rank="${key}"><i class="fas fa-ranking-star"></i> 순위 보기</button></div>
    </div>`;
    app.innerHTML = `<section class="hero"><h1>기타 <em>이상형 월드컵</em></h1><p>둘 중 하나만 고르세요. 끝까지 남는 게 당신의 운명의 기타!</p></section>
        <div class="themes">${Object.entries(THEMES).map(([k, t]) => card(k, t)).join('')}
            <div class="theme card soon"><div class="peek"><i>?</i><i>?</i><i>?</i><i>?</i></div><h2><i class="fas fa-hourglass-half" style="color:#b7c0bb"></i>다음 월드컵 <small>준비 중</small></h2>
            <div class="soonlist">${SOON.map(s => `<span>${esc(s)}</span>`).join('')}</div></div>
        </div>
        ${adSlot('wide')}`;
    app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => play(b.dataset.go, +b.dataset.n)));
    app.querySelectorAll('[data-rank]').forEach(b => b.addEventListener('click', () => rankPage(b.dataset.rank)));
    scrollTo(0, 0);
    // 지금 1위 (기록이 쌓인 뒤에만 보임)
    app.querySelectorAll('[data-lead]').forEach(el => loadRank(el.dataset.lead).then(d => {
        const top = d.list[0];
        if (d.plays && top && top.wins) el.textContent = `📊 지금 1위: ${top.it.ko} (우승 ${pct(top.wr)}) · ${d.plays.toLocaleString()}판`;
    }).catch(() => {}));
}

// ---------- 대결 ----------
let S = null;   // { key, theme, size, cur: [...], next: [...], i, hist: [], out: [{it, at: 몇 강에서 졌나}], log: [[이긴 k, 진 k], ...] }
function play(key, size) {
    const theme = THEMES[key];
    history.replaceState(null, '', `?t=${key}&n=${size}`);
    const pool = shuffle(theme.items).slice(0, size);
    S = { key, theme, size, cur: pool, next: [], i: 0, hist: [], out: [], log: [] };
    match();
}
function match() {
    const n = S.cur.length, a = S.cur[S.i], b = S.cur[S.i + 1];
    const done = S.size - n + S.i / 2, total = S.size - 1;   // 지금까지 끝난 대결 수 / 전체
    const card = (it, side) => `<button class="pick card" data-side="${side}" aria-label="${esc(it.n)} 고르기">
        <span class="ph-img"><img src="${imgSrc(it)}" alt="${esc(it.n)}"></span>
        <span class="nm"><b>${esc(it.n)}</b><small>${esc(it.ko)} · ${esc(it.y)}</small><span>${esc(it.d)}</span></span></button>`;
    app.innerHTML = `<div class="round"><b>${roundName(n)}${n > 2 ? ` <small style="font-size:15px;color:var(--sub)">${S.i / 2 + 1} / ${n / 2}</small>` : ''}</b>
            <span class="bar"><i style="width:${done / total * 100}%"></i></span>
            <button class="undo" ${S.hist.length ? '' : 'disabled'}><i class="fas fa-rotate-left"></i> 되돌리기</button></div>
        <p class="q">${esc(S.theme.q)}</p>
        <div class="vs">${card(a, 0)}<span class="mark">VS</span>${card(b, 1)}</div>
        <p class="keys">키보드 ← → 로도 고를 수 있어요</p>`;
    app.querySelectorAll('.pick').forEach(p => p.addEventListener('click', () => choose(+p.dataset.side)));
    scrollTo(0, 0);
    app.querySelector('.undo').addEventListener('click', undo);
    // 다음 대결 사진 미리 받기
    [S.cur[S.i + 2], S.cur[S.i + 3]].forEach(it => { if (it) new Image().src = imgSrc(it); });
}
let busy = false;
function choose(side) {
    if (busy) return;
    busy = true;
    const picks = app.querySelectorAll('.pick');
    picks[side].classList.add('won'); picks[1 - side].classList.add('lost');
    S.hist.push({ cur: S.cur, next: S.next.slice(), i: S.i, out: S.out.slice(), log: S.log.slice() });
    const w = S.cur[S.i + side], l = S.cur[S.i + 1 - side];
    S.out.push({ it: l, at: S.cur.length });
    S.log.push([w.k, l.k]);              // [이긴 기타, 진 기타] — 순위 집계용
    S.next.push(w); S.i += 2;
    setTimeout(() => {
        busy = false;
        if (S.i >= S.cur.length) {
            if (S.next.length === 1) return interstitial(() => winner(S.next[0]));
            S.cur = S.next; S.next = []; S.i = 0;
        }
        match();
    }, 420);
}
function undo() {
    const h = S.hist.pop();
    if (!h) return;
    Object.assign(S, h);
    match();
}
addEventListener('keydown', e => {
    if (!S || !app.querySelector('.vs')) return;
    if (e.key === 'ArrowLeft') choose(0);
    if (e.key === 'ArrowRight') choose(1);
});

// ---------- 우승 ----------
async function winner(w) {
    const second = S.out.find(o => o.at === 2), semis = S.out.filter(o => o.at === 4);
    const t = S.theme;
    app.innerHTML = `<section class="win">
        <div class="crown">🏆 WINNER · ${esc(t.title)} ${S.size}강</div>
        <h1>${esc(w.n)}</h1><div class="ko">${esc(w.ko)} · ${esc(w.y)}</div>
        <div class="big card"><div class="ph-img"><img src="${imgSrc(w)}" alt="${esc(w.n)}"></div>
            <div class="facts"><div><i class="fas fa-circle-info"></i>${esc(w.d)}</div>${w.p ? `<div><i class="fas fa-user"></i>${esc(w.p)}</div>` : ''}</div></div>
        <div class="podium">${second ? `<div><img src="${imgSrc(second.it)}" alt=""><span><small>준우승</small><b>${esc(second.it.n)}</b></span></div>` : ''}
            ${semis.map(o => `<div><img src="${imgSrc(o.it)}" alt=""><span><small>4강</small><b>${esc(o.it.n)}</b></span></div>`).join('')}</div>
        <div class="btns"><button class="btn" id="again"><i class="fas fa-rotate-right"></i>다시 하기</button>
            <button class="btn ghost" id="other"><i class="fas fa-shuffle"></i>다른 월드컵</button>
            <button class="btn ghost" id="share"><i class="fas fa-share-nodes"></i>결과 공유</button></div>
        ${adSlot('r300')}
        <div id="rk"><p class="stat-soon" style="text-align:center">📊 다른 사람들의 순위를 불러오는 중…</p></div>
        <div class="rec" id="rec"></div>
        <details class="credits"><summary>사진 출처 (Wikimedia Commons)</summary><ul>${t.items.map(it => `<li>${esc(it.n)} — ${esc(it.by)}, ${esc(it.lic)} · <a href="${esc(it.src)}" target="_blank" rel="noopener">원본</a></li>`).join('')}</ul></details>
    </section>`;
    scrollTo(0, 0);
    document.getElementById('again').onclick = () => play(S.key, S.size);
    document.getElementById('other').onclick = start;
    document.getElementById('share').onclick = () => share('기타 이상형 월드컵', `내 ${t.title} 우승은 「${w.n}」 🎸 너는 뭐 고를래?`);
    // 결과 저장 → 다른 사람들 순위 (db/play_stats.sql 적용 뒤부터. 그 전엔 '곧 열려요')
    const s = S;
    if (!s.saved) {
        s.saved = true;
        rpc('play_wc_save', { p_theme: s.key, p_size: s.size, p_matches: s.log }).catch(() => {})
            .then(() => loadRank(s.key))
            .then(d => { if (S === s) document.getElementById('rk').innerHTML = rankHtml(s.key, d, w.k); })
            .catch(() => { if (S === s) document.getElementById('rk').innerHTML = SOON_BOX; });
    }
    // 일렉 악보 추천 — 공개한 일렉기타·기타솔로 악보 중 풀스코어 주문이 많은 곡
    try {
        const rows = (await catalog()).filter(s => s.on_sale && (s.style === 'electric' || s.style === 'solo'));
        rows.sort((a, b) => (b.fullscore_orders || 0) - (a.fullscore_orders || 0));
        const seen = new Set(), top = rows.filter(s => { const k = PLAY.baseTitle(s.title).toLowerCase(); return !seen.has(k) && seen.add(k); }).slice(0, 6);   // 같은 곡 일렉·솔로는 하나만
        if (top.length) document.getElementById('rec').innerHTML = `<h3><i class="fas fa-music" style="color:var(--green-mid)"></i>이 기타로 쳐 볼 일렉 악보 <small>안쌤 TAB악보</small></h3><div class="list">${top.map(recRow).join('')}</div>`;
    } catch (e) {}
}

// ---------- 순위 (우승 비율 = 우승 ÷ 나온 판, 1:1 승률 = 대결에서 이긴 비율) ----------
const SOON_BOX = `<div class="stat-soon"><b>📊 다른 사람들은 뭘 골랐을까?</b><br>순위는 곧 열려요. 우승 비율과 1:1 승률을 모아서 보여 줄게요.</div>`;
const pct = v => (v * 100 < 10 && v > 0 ? (v * 100).toFixed(1) : Math.round(v * 100)) + '%';
async function loadRank(key) {
    const rows = await rpc('play_wc_stats', { p_theme: key });
    if (!Array.isArray(rows)) throw new Error('stats');
    const by = new Map(rows.map(r => [r.item, r]));
    const plays = rows.length ? rows[0].plays : 0;
    const list = THEMES[key].items.map(it => {
        const r = by.get(it.k) || {};
        const games = r.games || 0, wins = r.wins || 0, mw = r.match_wins || 0, mt = r.match_total || 0;
        return { it, games, wins, mw, mt, wr: games ? wins / games : 0, mr: mt ? mw / mt : 0 };
    }).sort((a, b) => b.wr - a.wr || b.mr - a.mr || b.games - a.games);
    return { plays, list };
}
function rankHtml(key, d, mine, all) {
    if (!d.plays) return `<div class="stat-soon"><b>📊 아직 기록이 없어요</b><br>첫 번째 기록의 주인공이 되어 보세요!</div>`;
    const max = Math.max(...d.list.map(x => x.wr), 0.01);
    const rows = all ? d.list : d.list.slice(0, 8);
    const mineRow = !all && mine && !rows.some(x => x.it.k === mine) ? d.list.find(x => x.it.k === mine) : null;
    const li = x => `<li class="${x.it.k === mine ? 'me' : ''}"><span class="no">${d.list.indexOf(x) + 1}</span><img src="${imgSrc(x.it)}" alt="" loading="lazy">
        <span class="nm"><b>${esc(x.it.n)}</b><small>${esc(x.it.ko)}${x.it.k === mine ? ' · 내 우승' : ''}</small></span>
        <span class="wr"><span class="bar"><i style="width:${(x.wr / max * 100).toFixed(1)}%"></i></span>${pct(x.wr)}</span><span class="mr">${x.mt ? pct(x.mr) : '-'}</span></li>`;
    return `<div class="rank card"><h3>📊 다른 사람들의 우승 비율 <small>${esc(THEMES[key].title)} · 지금까지 ${d.plays.toLocaleString()}판</small></h3>
        <ol><li class="hd"><span>순위</span><span></span><span>기타</span><span>우승 비율</span><span class="mr">1:1 승률</span></li>${rows.map(li).join('')}${mineRow ? `<li class="hd"><span></span><span></span><span>…</span></li>${li(mineRow)}` : ''}</ol>
        ${all ? '' : `<button class="more" data-allrank="${key}">전체 순위 보기 →</button>`}
        <p class="note">우승 비율 = 그 기타가 나온 판 중 우승한 비율 · 1:1 승률 = 둘 중 하나 고를 때 뽑힌 비율</p></div>`;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-allrank]'); if (b) rankPage(b.dataset.allrank); });
async function rankPage(key) {
    const t = THEMES[key];
    S = null;
    history.replaceState(null, '', `?t=${key}&rank=1`);
    app.innerHTML = `<section class="win"><div class="crown">📊 RANKING</div><h1>${esc(t.title)}</h1><div class="ko">다른 사람들이 가장 많이 우승시킨 기타</div>
        <div id="rk"><p class="stat-soon" style="text-align:center">불러오는 중…</p></div>
        <div class="btns"><button class="btn" data-go="${key}" data-n="16"><i class="fas fa-play"></i>나도 16강 하기</button><button class="btn ghost" data-go="${key}" data-n="8">8강 빠르게</button><button class="btn ghost" id="other"><i class="fas fa-shuffle"></i>다른 월드컵</button></div>
        ${adSlot('r300')}</section>`;
    app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => play(b.dataset.go, +b.dataset.n)));
    document.getElementById('other').onclick = start;
    scrollTo(0, 0);
    try { const d = await loadRank(key); document.getElementById('rk').innerHTML = rankHtml(key, d, null, true); }
    catch (e) { document.getElementById('rk').innerHTML = SOON_BOX; }
}

// 주소로 바로 들어오면(?t=classic&n=16) 그 월드컵부터, ?t=classic&rank=1 이면 순위
const P = new URLSearchParams(location.search);
if (THEMES[P.get('t')] && P.get('rank')) rankPage(P.get('t'));
else if (THEMES[P.get('t')]) play(P.get('t'), [8, 16].includes(+P.get('n')) ? +P.get('n') : 16);
else start();
</script>
</body>
</html>
